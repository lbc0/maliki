<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --font-ui:'IBM Plex Sans Arabic','Noto Sans Arabic','Segoe UI',Tahoma,'Geeza Pro',system-ui,sans-serif;
  --font-text:'Amiri','Scheherazade New','Noto Naskh Arabic','Traditional Arabic','Geeza Pro','DejaVu Sans',serif;
  --scale:1;
  --ground:#E8EDE9; --surface:#FBFCFA; --sunk:#DDE4DF; --desk:#C9D3CD;
  --ink:#18203A; --ink-2:#464F68; --ink-3:#586177;
  --line:#C3CDC7; --line-soft:#D8DFDA;
  --rubric:#A3342A; --on-rubric:#FFFFFF;
  --lapis:#2A4F94; --on-lapis:#FFFFFF; --lapis-soft:#DCE5F4;
  --ochre:#A97F24; --ochre-soft:#F1E6C6; --hl:#C98A00; --gold-ink:#7C5A0E;
  --verdigris:#2A7262; --verdigris-soft:#D3E8E0;
  --mark:rgba(176,138,46,.36);
  --wajib-bg:#F2D8D3; --wajib-fg:#86271E; --wajib-bar:#A3342A;
  --sunna-bg:#D3E9E1; --sunna-fg:#1E6252; --sunna-bar:#2E7767;
  --mustahabb-bg:#D9E3F3; --mustahabb-fg:#244783; --mustahabb-bar:#2A4F94;
  --mubah-bg:#E3E5E8; --mubah-fg:#474D5E; --mubah-bar:#7C8494;
  --makruh-bg:#F1E3BF; --makruh-fg:#6E4E0C; --makruh-bar:#B08A2E;
  --haram-bg:#E9D2E0; --haram-fg:#6E1F4C; --haram-bar:#8A2F63;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
color-scheme:dark;
--ground:#121829; --surface:#1A2138; --sunk:#0F1424; --desk:#0A0E1A;
--ink:#E9E6DA; --ink-2:#BBC0CE; --ink-3:#9AA2B6;
--line:#2C3550; --line-soft:#232B43;
--rubric:#E58478; --on-rubric:#1B1010;
--lapis:#8FB0F0; --on-lapis:#0E1322; --lapis-soft:#1D2A4A;
--ochre:#D6B15B; --ochre-soft:#2F2914; --hl:#E2B54A; --gold-ink:#E0C27A;
--verdigris:#66C3AE; --verdigris-soft:#17352F;
--mark:rgba(214,177,91,.38);
--wajib-bg:#3B1F1D; --wajib-fg:#F2A9A0; --wajib-bar:#E0776B;
--sunna-bg:#17352E; --sunna-fg:#8DD7C3; --sunna-bar:#63C2AE;
--mustahabb-bg:#1B2A47; --mustahabb-fg:#A9C3F3; --mustahabb-bar:#7FA3EA;
--mubah-bg:#262B38; --mubah-fg:#B7BECC; --mubah-bar:#8C95A8;
--makruh-bg:#3A2F14; --makruh-fg:#E8C77A; --makruh-bar:#D9B45A;
--haram-bg:#36192B; --haram-fg:#E9A8CC; --haram-bar:#C871A5;

} }
:root[data-theme="dark"]{
color-scheme:dark;
--ground:#121829; --surface:#1A2138; --sunk:#0F1424; --desk:#0A0E1A;
--ink:#E9E6DA; --ink-2:#BBC0CE; --ink-3:#9AA2B6;
--line:#2C3550; --line-soft:#232B43;
--rubric:#E58478; --on-rubric:#1B1010;
--lapis:#8FB0F0; --on-lapis:#0E1322; --lapis-soft:#1D2A4A;
--ochre:#D6B15B; --ochre-soft:#2F2914; --hl:#E2B54A; --gold-ink:#E0C27A;
--verdigris:#66C3AE; --verdigris-soft:#17352F;
--mark:rgba(214,177,91,.38);
--wajib-bg:#3B1F1D; --wajib-fg:#F2A9A0; --wajib-bar:#E0776B;
--sunna-bg:#17352E; --sunna-fg:#8DD7C3; --sunna-bar:#63C2AE;
--mustahabb-bg:#1B2A47; --mustahabb-fg:#A9C3F3; --mustahabb-bar:#7FA3EA;
--mubah-bg:#262B38; --mubah-fg:#B7BECC; --mubah-bar:#8C95A8;
--makruh-bg:#3A2F14; --makruh-fg:#E8C77A; --makruh-bar:#D9B45A;
--haram-bg:#36192B; --haram-fg:#E9A8CC; --haram-bar:#C871A5;

}

*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; overflow-x:hidden}
body{height:100%; margin:0; overflow-x:hidden; background:var(--ground); color:var(--ink); font-family:var(--font-ui); font-size:16px; line-height:1.65; text-rendering:optimizeLegibility; -webkit-font-smoothing:antialiased}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
a{color:var(--lapis); text-underline-offset:3px}
mark{background:var(--mark); color:inherit; padding:0 1px; border-radius:2px}
:focus-visible{outline:2px solid var(--lapis); outline-offset:2px; border-radius:3px}
h1,h2,h3{margin:0}
[hidden]{display:none!important}
.sr{position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
.muted{color:var(--ink-3)}
.ok{color:var(--verdigris); font-weight:600} .no{color:var(--rubric); font-weight:600}
input[type=search]::-webkit-search-cancel-button{display:none}

/* ---------- tone helpers ---------- */
.t-wajib{--tone-bg:var(--wajib-bg);--tone-fg:var(--wajib-fg);--tone-bar:var(--wajib-bar)}
.t-sunna{--tone-bg:var(--sunna-bg);--tone-fg:var(--sunna-fg);--tone-bar:var(--sunna-bar)}
.t-mustahabb{--tone-bg:var(--mustahabb-bg);--tone-fg:var(--mustahabb-fg);--tone-bar:var(--mustahabb-bar)}
.t-mubah{--tone-bg:var(--mubah-bg);--tone-fg:var(--mubah-fg);--tone-bar:var(--mubah-bar)}
.t-makruh{--tone-bg:var(--makruh-bg);--tone-fg:var(--makruh-fg);--tone-bar:var(--makruh-bar)}
.t-haram{--tone-bg:var(--haram-bg);--tone-fg:var(--haram-fg);--tone-bar:var(--haram-bar)}

/* ---------- app shell ---------- */
.app{display:flex; flex-direction:column; height:100%; min-height:0}
.topbar{flex:none; display:flex; align-items:center; gap:10px; padding:9px 16px; background:var(--surface); border-bottom:1px solid var(--line); position:relative; z-index:20}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); flex:none}
.brand .mark{width:36px; height:36px; color:var(--rubric); flex:none}
.brand strong{display:block; font-family:var(--font-text); font-size:23px; line-height:1.15; font-weight:700}
.brand em{display:block; font-style:normal; font-size:12px; color:var(--ink-3); line-height:1.3}
.search{flex:1 1 320px; max-width:660px; min-width:0; position:relative; margin-inline:6px}
.search input{width:100%; height:42px; border:1px solid var(--line); background:var(--ground); border-radius:6px; padding-inline:40px 38px; font-size:16px}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{outline:none; border-color:var(--lapis); box-shadow:0 0 0 3px color-mix(in srgb, var(--lapis) 25%, transparent); background:var(--surface)}
.search .ic{position:absolute; inset-inline-start:12px; top:50%; transform:translateY(-50%); color:var(--ink-3); pointer-events:none; display:grid}
.search .clr{position:absolute; inset-inline-end:5px; top:50%; transform:translateY(-50%)}
.top-actions{display:flex; align-items:center; gap:4px; margin-inline-start:auto}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:38px; padding:0 14px; border:1px solid var(--line); background:var(--surface); border-radius:6px; text-decoration:none; color:var(--ink); font-size:15px; line-height:1.2; white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--lapis); border-color:var(--lapis); color:var(--on-lapis)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent; background:transparent}
.btn.ghost:hover{background:color-mix(in srgb, var(--ink) 7%, transparent)}
.btn.sm{min-height:32px; padding:0 11px; font-size:14px}
.btn.xs{min-height:26px; padding:0 8px; font-size:13px; gap:5px}
.btn.on,.btn[aria-pressed=true]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.icon-btn{display:inline-grid; place-items:center; width:38px; height:38px; border:1px solid transparent; background:transparent; border-radius:6px; color:var(--ink)}
.icon-btn:hover{background:color-mix(in srgb, var(--ink) 8%, transparent)}
.icon-btn.sm{width:32px; height:32px}
.only-narrow{display:none}
.badge{display:inline-grid; place-items:center; min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--rubric); color:var(--on-rubric); font-size:12px; font-weight:700; line-height:1}
.link{background:none; border:0; padding:2px 4px; color:var(--lapis); font-size:14px}
.link:hover{text-decoration:underline}

.notice{flex:none; background:var(--ochre-soft); border-bottom:1px solid var(--ochre); padding:6px 16px; font-size:13.5px; line-height:1.55}
.notice b{color:var(--rubric)}
.notice .short{display:none}

/* ---------- filter tray ---------- */
.tray{flex:none; background:var(--surface); border-bottom:1px solid var(--line); max-height:48%; overflow:auto; padding:14px 18px 12px}
.tray-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px 30px}
.fg{border:0; margin:0; padding:0; min-width:0}
.fg.wide{grid-column:span 2}
.fg legend{font-weight:600; font-size:14px; color:var(--ink-2); padding:0; margin-bottom:8px}
.fg legend small{font-weight:400; color:var(--ink-3)}
.tp{display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; padding:5px 0; border-bottom:1px dashed var(--line-soft)}
.tp:last-child{border-bottom:0}
.kids{display:flex; flex-wrap:wrap; gap:6px}
.tray-f{display:flex; align-items:center; gap:10px; margin-top:12px; padding-top:10px; border-top:1px solid var(--line-soft)}
.tray-f .muted{margin-inline-end:auto; font-size:14px}
.chips{display:flex; flex-wrap:wrap; gap:7px; margin:10px 0 0}
.chip{display:inline-flex; align-items:center; gap:7px; padding:3px 12px; min-height:30px; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; font-size:14.5px; text-decoration:none; line-height:1.3}
.chip:hover{border-color:var(--ink-3)}
.chip .n{font-size:12px; color:var(--ink-3)}
.chip[aria-pressed=true]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.chip[aria-pressed=true] .n{color:inherit; opacity:.8}
.chip[disabled]{opacity:.42; cursor:not-allowed}
.chip.parent{font-weight:600}
.chip.tone{border-radius:6px; border-inline-start:4px solid var(--tone-bar)}
.chip.tone[aria-pressed=true]{background:var(--tone-bg); color:var(--tone-fg); border-color:var(--tone-bar)}
.chip.kw{border-style:dashed}
.chip.hal{background:var(--verdigris-soft); border-color:transparent; color:var(--ink)}
.chip.on{background:var(--lapis-soft); border-color:var(--lapis); color:var(--ink)}
.chip.on.tone{background:var(--tone-bg); color:var(--tone-fg); border-color:var(--tone-bar)}
.chips.active{align-items:center; margin:2px 0 10px}

/* ---------- three panes ---------- */
.shell{flex:1; min-height:0; min-width:0; display:grid; grid-template-columns:300px minmax(0,1fr)}
.shell.has-panel{grid-template-columns:300px minmax(0,1fr) minmax(340px,430px)}
.side{overflow:auto; background:var(--sunk); border-inline-end:1px solid var(--line); padding-bottom:28px}
.main{overflow:auto; min-width:0; outline:none; contain:layout}
.panel{display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden; background:var(--desk); border-inline-start:1px solid var(--line)}

/* ---------- tree ---------- */
.side-h{display:flex; align-items:center; justify-content:space-between; padding:14px 14px 6px 12px}
.side-h h2{font-size:14px; font-weight:600; color:var(--ink-2)}
.tree,.tree ul{list-style:none; margin:0; padding:0}
.trow{display:flex; align-items:center; gap:2px; min-height:38px; padding-inline:calc(6px + var(--d,0) * 16px) 10px; border-inline-start:3px solid transparent}
.trow:hover{background:color-mix(in srgb, var(--ink) 6%, transparent)}
.trow.current{background:var(--surface); border-inline-start-color:var(--rubric)}
.tw{flex:none; width:26px; height:26px; display:inline-grid; place-items:center; border:0; background:none; color:var(--ink-3); border-radius:4px; padding:0}
.tw:hover{background:color-mix(in srgb, var(--ink) 10%, transparent)}
.tw svg{transition:transform .12s}
.tw[aria-expanded=false] svg{transform:rotate(90deg)}
.tw.sp{visibility:hidden}
.tl{flex:1; min-width:0; font-family:var(--font-text); font-size:18.5px; line-height:1.45; padding:4px 4px; color:var(--ink); text-decoration:none}
.tl:hover{color:var(--rubric)}
.kitab>.trow .tl{font-weight:700; color:var(--rubric); font-size:20px}
.cnt{flex:none; min-width:24px; text-align:center; font-size:12.5px; color:var(--ink-3)}

/* ---------- reading column ---------- */
.view{max-width:880px; margin-inline:auto; padding:22px 30px 72px}
.hero{padding:18px 0 6px}
.display{font-family:var(--font-text); font-weight:700; font-size:clamp(34px,5vw,54px); line-height:1.25; color:var(--rubric)}
.lede{max-width:62ch; font-size:17px; color:var(--ink-2); margin:10px 0 6px; text-wrap:pretty}
.h-page{font-family:var(--font-text); font-weight:700; font-size:clamp(25px,2.6vw,34px); line-height:1.5; margin:2px 0 4px; text-wrap:balance}
.kitab-title{color:var(--rubric)}
.h-sec{font-size:15px; font-weight:600; color:var(--ink-2); margin:30px 0 4px; padding-bottom:6px; border-bottom:1px solid var(--line)}
.sub{color:var(--ink-3); margin:2px 0 0; font-size:15px}
.h-sec + .mlist,.h-sec + .toc{margin-top:4px}
.h-sec + .mlist{border-top:0}
.empty,.emptybox{color:var(--ink-2)}
.emptybox{padding:26px 20px; border:1px dashed var(--line); background:var(--surface); margin-top:16px}
.emptybox p{margin:0 0 10px}
.crumbs{display:flex; flex-wrap:wrap; align-items:center; gap:2px 0; list-style:none; margin:0 0 10px; padding:0; font-size:14px; color:var(--ink-3)}
.crumbs a{color:var(--ink-2); text-decoration:none}
.crumbs a:hover{color:var(--rubric); text-decoration:underline}
.crumbs li+li::before,.pth span+span::before{content:""; display:inline-block; width:6px; height:6px; margin:0 9px; border-top:1.5px solid var(--ink-3); border-left:1.5px solid var(--ink-3); transform:rotate(-45deg) translateY(1px)}  /* physical borders on purpose: a chevron that always points left (reading direction) */
.pth{display:inline-flex; flex-wrap:wrap; align-items:center}
.pth span{color:var(--ink-3); font-size:13.5px}

.toc{list-style:none; margin:10px 0 0; padding:0}
.toc li{display:flex; align-items:baseline; gap:10px; padding:8px 0}
.toc a{font-family:var(--font-text); font-size:24px; font-weight:700; color:var(--ink); text-decoration:none; line-height:1.5}
.toc a.kitab-title{color:var(--rubric)}
.toc a:hover{text-decoration:underline; text-decoration-thickness:1.5px}
.toc .lead{flex:1; min-width:18px; border-bottom:2px dotted var(--line); transform:translateY(-6px)}
.toc .n{color:var(--ink-3); font-size:14px; white-space:nowrap}

.mlist{list-style:none; margin:12px 0 0; padding:0; border-top:1px solid var(--line)}
.mrow{display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:start; gap:6px 18px; padding:14px 2px; border-bottom:1px solid var(--line-soft)}
.mtitle{font-family:var(--font-text); font-size:21px; font-weight:700; line-height:1.65; color:var(--ink); text-decoration:none}
.mtitle:hover{color:var(--lapis); text-decoration:underline}
.mr-main .rpath{margin-top:1px}
.snip-line{margin:6px 0 0; font-size:15px; color:var(--ink-2); line-height:1.9}
.snip-l{display:inline-block; margin-inline-end:8px; padding:0 8px; font-size:12.5px; color:var(--ink-3); border:1px solid var(--line); border-radius:3px}
.mmeta{display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:8px}
.kh-badge{display:inline-flex; align-items:center; gap:8px; font-size:14px; color:var(--ink-2)}
.kh-badge.multi{color:var(--ink); font-weight:600}
.mini{display:inline-flex; gap:2px}
.mini i{display:block; width:13px; height:8px; background:var(--tone-bar); border-radius:1px}
.star{display:inline-grid; place-items:center; width:34px; height:34px; border:0; background:none; color:var(--ink-3); border-radius:6px}
.star:hover{color:var(--ochre); background:color-mix(in srgb, var(--ochre) 12%, transparent)}
.star.on{color:var(--ochre)}
.hk{display:inline-flex; align-items:center; padding:0 10px; min-height:24px; border-radius:4px; background:var(--tone-bg); color:var(--tone-fg); border-inline-start:3px solid var(--tone-bar); font-weight:600; font-size:13.5px; line-height:1.4; white-space:nowrap}
.hk.hit{outline:2px solid var(--tone-bar); outline-offset:1px}

/* ---------- mas'ala ---------- */
.mhead{display:flex; align-items:flex-start; justify-content:space-between; gap:16px}
.mtools{display:flex; gap:8px; flex:none; padding-top:8px}
.qdesc{font-family:var(--font-text); font-size:calc(19px * var(--scale)); line-height:2; color:var(--ink-2); margin:6px 0 4px; text-wrap:pretty}
.khilaf{position:sticky; top:0; z-index:6; display:flex; flex-wrap:wrap; align-items:center; gap:8px 18px; margin-top:14px; padding:10px 0; background:var(--ground); border-bottom:1px solid var(--line)}
.kh-lab{display:flex; align-items:baseline; gap:8px; flex:none}
.kh-lab strong{font-family:var(--font-text); font-size:20px; color:var(--rubric); line-height:1.4}
.kh-lab span{font-size:14px; color:var(--ink-2)}
.kh-segs{display:flex; flex-wrap:wrap; gap:6px; flex:1 1 320px}
.seg{flex:1 1 92px; display:inline-flex; align-items:center; gap:9px; padding:4px 12px; min-height:34px; border:0; border-inline-start:4px solid var(--tone-bar); background:var(--tone-bg); color:var(--tone-fg); border-radius:3px; font-weight:600; font-size:14.5px; text-align:start}
.seg:hover{filter:brightness(.97)}
.seg .sn{font-family:var(--font-text); font-size:18px; font-weight:700; min-width:14px}
.kh-note{flex-basis:100%; margin:0; font-size:13.5px; color:var(--ink-3)}
.qbar{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; margin:14px 0 2px}
.seg-group{display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--surface)}
.sg{border:0; background:none; padding:5px 13px; min-height:32px; font-size:14px; border-inline-start:1px solid var(--line)}
.sg:first-child{border-inline-start:0}
.sg[aria-pressed=true]{background:var(--ink); color:var(--surface)}
.sel{display:inline-flex; align-items:center; gap:8px; font-size:14px; color:var(--ink-2)}
.sel select{min-height:32px; border:1px solid var(--line); background:var(--surface); border-radius:6px; padding:0 8px; font-size:14px}
.hint{font-size:13.5px; color:var(--ink-3); margin:6px 0 0}

.jadwal{margin:22px 7px 30px; background:var(--surface); border:1px solid var(--ochre); outline:1px solid var(--ochre); outline-offset:5px}
.qawl{display:grid; grid-template-columns:66px minmax(0,1fr); border-top:1px solid var(--line-soft); border-inline-start:4px solid var(--tone-bar); scroll-margin-top:96px}
.qawl:first-child{border-top:0}
.qawl.matched{background:color-mix(in srgb, var(--tone-bg) 45%, var(--surface))}
.qawl.flash{animation:flash 1.3s ease-out}
@keyframes flash{0%{background:color-mix(in srgb, var(--hl) 35%, var(--surface))}100%{background:transparent}}
.qn{display:flex; justify-content:center; padding-top:20px; border-inline-end:1px solid var(--line-soft)}
.rosette{position:relative; display:inline-block; width:42px; height:42px; color:var(--tone-bar)}
.rosette svg{position:absolute; inset:0; width:100%; height:100%}
.rosette b{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--font-text); font-size:19px; font-weight:700; color:var(--ink); padding-top:3px}
.qb{padding:16px 20px 18px 18px; min-width:0}
.qtop{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px}
.qh{font-size:14.5px; font-weight:600; color:var(--ink-2); margin-inline-end:4px}
.ver{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; padding:0 8px; min-height:22px; border-radius:999px; border:1px solid var(--line); color:var(--ink-3)}
.ver.review{color:var(--gold-ink); border-color:var(--ochre)}
.ver.verified{color:var(--verdigris); border-color:var(--verdigris); background:var(--verdigris-soft)}
.hitbadge{font-size:12.5px; font-weight:600; color:var(--tone-fg); background:var(--tone-bg); padding:0 8px; border-radius:3px}
.qtext{font-family:var(--font-text); font-size:calc(22px * var(--scale)); line-height:2.05; margin:6px 0 8px; text-wrap:pretty}
.who-row{display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; margin:6px 0}
.lbl{font-size:13px; color:var(--ink-3); margin-inline-end:2px}
.who{display:inline-flex; align-items:baseline; gap:6px; padding:1px 10px; background:var(--sunk); border-radius:999px; font-size:14px}
.who i{font-style:normal; font-size:12.5px; color:var(--ink-3)}
.tj{display:inline-flex; align-items:baseline; gap:6px; padding:1px 10px; border:1px solid var(--ochre); background:var(--ochre-soft); color:var(--ink); border-radius:999px; font-size:14px}
.tj b{font-family:var(--font-text); font-size:16px}
.tj i{font-style:normal; font-size:12.5px; color:var(--ink-2)}
.tj:hover{filter:brightness(.97)}
.cites{list-style:none; margin:10px 0 4px; padding:0; display:grid; gap:6px}
.cite{display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; padding:7px 10px; background:var(--sunk); border-radius:4px; border-inline-start:3px solid transparent}
.cite.active{border-inline-start-color:var(--hl); background:color-mix(in srgb, var(--hl) 16%, var(--sunk))}
.ctext{flex:1 1 230px; min-width:0; display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 12px}
.src{font-family:var(--font-text); font-size:18px; font-weight:700}
.loc{font-weight:600; color:var(--ink-2); font-size:14.5px; white-space:nowrap}
.cact{display:flex; align-items:center; gap:4px; margin-inline-start:auto}
.tier{display:inline-flex; align-items:center; gap:6px; padding:0 9px; min-height:22px; border-radius:999px; border:1px solid currentColor; font-size:12.5px; font-weight:600; white-space:nowrap; background:var(--surface)}
.tier::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor}
.tier.exact{color:var(--verdigris)} .tier.page{color:var(--gold-ink)} .tier.link{color:var(--lapis)} .tier.text{color:var(--ink-3)}
.more{margin-top:8px; border:0; background:none; padding:2px 0; color:var(--lapis); font-size:14px}
.more:hover{text-decoration:underline}
.details{margin-top:8px; display:grid; gap:14px}
.qt{margin:0; padding-top:10px; border-top:1px dashed var(--line)}
.qt figcaption{font-size:14px; color:var(--ink-2); margin-bottom:6px}
.quote{position:relative; margin:0; padding:8px 14px; font-family:var(--font-text); font-size:calc(20px * var(--scale)); line-height:2; color:var(--ink); background:color-mix(in srgb, var(--ochre-soft) 55%, transparent); border-inline-start:3px solid var(--ochre)}
.qkind{display:block; font-family:var(--font-ui); font-size:12px; color:var(--gold-ink); line-height:1.6}
.snip-slot{margin-top:8px}
.snip{display:block; max-width:100%; height:auto; border:1px solid var(--line); background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.12)}
.note{margin:0; font-size:14.5px; color:var(--ink-2)}
.scroll-x{overflow-x:auto; margin:22px 0 30px; border:1px solid var(--ochre); background:var(--surface)}
.cmp{width:100%; min-width:720px; border-collapse:collapse; font-size:15px}
.cmp th,.cmp td{padding:12px 12px; text-align:start; vertical-align:top; border-bottom:1px solid var(--line-soft)}
.cmp thead th{font-size:13px; font-weight:600; color:var(--ink-3); background:var(--sunk); white-space:nowrap}
.cmp tbody tr{border-inline-start:4px solid var(--tone-bar)}
.cmp tbody tr.matched{background:color-mix(in srgb, var(--tone-bg) 45%, var(--surface))}
.cmp tbody th{width:64px}
.cmp .ctx{font-family:var(--font-text); font-size:18px; line-height:1.9; min-width:220px}
.cmp .cc{display:flex; flex-direction:column; align-items:flex-start; gap:5px}
.numbtn{border:0; background:none; padding:0}
.dot{width:8px; height:8px; border-radius:50%; background:var(--ink-3); flex:none}
.dot.exact{background:var(--verdigris)} .dot.page{background:var(--ochre)} .dot.link{background:var(--lapis)}
.rel-h{font-size:14.5px; font-weight:600; color:var(--ink-2); margin:14px 0 2px}
.rel-l{list-style:none; margin:0; padding:0}
.rel-l li{padding:8px 0; border-bottom:1px solid var(--line-soft)}
.rel-l a{font-family:var(--font-text); font-size:19px; font-weight:700; text-decoration:none; color:var(--ink)}
.rel-l a:hover{color:var(--lapis); text-decoration:underline}
.rel-l .rpath{display:block}
.pn{display:flex; justify-content:space-between; gap:12px; margin-top:34px; padding-top:14px; border-top:1px solid var(--line)}
.pn a{display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:var(--ink); padding:6px 10px; border-radius:6px}
.pn a:hover{background:color-mix(in srgb, var(--ink) 7%, transparent)}

/* ---------- source panel: the page lying on a darker desk ---------- */
.ph{flex:none; display:flex; align-items:flex-start; gap:10px; padding:12px 14px; background:var(--surface); border-bottom:1px solid var(--line)}
.ph-t{flex:1; min-width:0}
.ph-src{font-family:var(--font-text); font-size:20px; font-weight:700; line-height:1.5}
.ph-loc{display:flex; align-items:center; gap:10px}
.ph-path{margin-top:2px}
.pbody{flex:1; min-height:0; overflow:auto; padding:14px 14px 22px}
.pnav{display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:10px}
.plabel{min-width:190px; text-align:center; font-size:14px; font-weight:600; color:var(--ink)}
.folio{background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.2), 0 10px 26px rgba(0,0,0,.16); position:relative; overflow:hidden; direction:ltr}
.pv{position:relative; line-height:0; min-height:120px}
.pv canvas{display:block}
.pv-ov{position:absolute; inset:0; pointer-events:none}
.pv-ov.cap{pointer-events:auto; cursor:crosshair; touch-action:none; outline:2px dashed var(--hl); outline-offset:-2px}
.hl{position:absolute; border:2px solid var(--hl); background:color-mix(in srgb, var(--hl) 20%, transparent); box-shadow:0 0 0 9999px rgba(15,20,40,.17); border-radius:2px}
.pv-msg{position:absolute; inset:0; display:grid; place-items:center; padding:20px; text-align:center; font-family:var(--font-ui); font-size:14px; line-height:1.7; color:#464F68; background:rgba(255,255,255,.88)}
.pv-msg.err{color:#A3342A}
.pnote{font-size:13.5px; color:var(--ink-2); margin:10px 2px 0}
.locj{margin-top:10px; font-size:13.5px}
.locj summary{cursor:pointer; color:var(--ink-2)}
.code{direction:ltr; text-align:left; unicode-bidi:isolate; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; line-height:1.6; background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:8px 10px; margin:6px 0; overflow:auto; white-space:pre-wrap; word-break:break-all}
pre.code{white-space:pre}
.pmsg{padding:18px; background:var(--surface); border:1px solid var(--line)}
.pmsg h3{font-family:var(--font-text); font-size:22px; margin-bottom:6px}
.pmsg p{margin:0 0 10px; font-size:15px; color:var(--ink-2)}
.pfoot{flex:none; display:flex; flex-wrap:wrap; gap:8px; padding:10px 14px; background:var(--surface); border-top:1px solid var(--line)}

/* ---------- settings, toast, scrim ---------- */
.popover{position:fixed; top:calc(58px + env(safe-area-inset-top,0px)); inset-inline-end:14px; z-index:60; width:min(340px, calc(100vw - 28px)); background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:6px 14px; box-shadow:0 12px 32px rgba(10,14,26,.24)}
.set-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line-soft); font-size:14.5px}
.set-row:last-child{border-bottom:0}
.scrim{position:fixed; inset:0; background:rgba(10,14,26,.42); z-index:35}
.toast{position:fixed; inset-inline:0; bottom:calc(20px + env(safe-area-inset-bottom,0px)); margin-inline:auto; width:max-content; max-width:88vw; padding:9px 18px; border-radius:6px; background:var(--ink); color:var(--surface); font-size:14.5px; opacity:0; pointer-events:none; transform:translateY(8px); transition:opacity .15s, transform .15s; z-index:80}
.toast.show{opacity:1; transform:none; pointer-events:auto}

/* ---------- lab ---------- */
.lab-card{background:var(--surface); border:1px solid var(--line); padding:16px 18px 14px; margin:16px 0}
.lab-card h2{font-size:17px; font-weight:600; margin-bottom:10px}
.lab-card h3{font-size:14px; font-weight:600; color:var(--ink-2); margin:14px 0 4px}
.lab-card p{margin:0 0 8px}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 20px; margin:0; font-size:14.5px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
.row{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin:8px 0}
.row label{display:inline-flex; align-items:center; gap:8px; font-size:14.5px}
.row select,.row input[type=url],.row input[type=number]{min-height:34px; border:1px solid var(--line); background:var(--ground); border-radius:6px; padding:0 8px; font-size:14px}
.row .grow{flex:1 1 320px} .row .grow input{flex:1; min-width:0}
.lab-2col{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px}
.snipbox{min-height:40px}
.lab-if{display:block; width:100%; height:420px; border:1px solid var(--line); background:#fff; margin-top:10px}
.log{list-style:none; margin:0; padding:0; max-height:260px; overflow:auto; font-size:13px}
.log li{display:flex; gap:12px; padding:3px 0; border-bottom:1px solid var(--line-soft)}
.log time{flex:none; direction:ltr; color:var(--ink-3); font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px}
.log li.err span{color:var(--rubric)} .log li.ok span{color:var(--verdigris)}

/* ---------- responsive ---------- */
@media (max-width:960px){
  .only-narrow{display:inline-grid}
  .topbar{flex-wrap:wrap; gap:8px 8px; padding:8px 12px}
  .brand{flex:1 1 auto}
  .brand em{display:none}
  .brand strong{font-size:20px}
  .brand .mark{width:30px; height:30px}
  .top-actions{margin-inline-start:0}
  .top-actions .bt{display:none}
  .search{order:5; flex:1 1 200px; margin:0}
  #trayBtn{order:6}
  .shell,.shell.has-panel{grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr)}
  .side{position:fixed; top:0; bottom:0; inset-inline-start:0; width:min(88vw,340px); z-index:40; transform:translateX(100%); transition:transform .18s; padding-top:env(safe-area-inset-top,0px); padding-bottom:calc(28px + env(safe-area-inset-bottom,0px)); box-shadow:0 0 30px rgba(10,14,26,.3)}
  .side.open{transform:none}
  .panel{position:fixed; inset-inline:0; bottom:0; height:min(84%,720px); z-index:45; border-radius:14px 14px 0 0; border-inline-start:0; border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); box-shadow:0 -10px 30px rgba(10,14,26,.3)}
  .view{padding:16px 16px 72px}
  .mhead{flex-direction:column; gap:6px}
  .mtools{padding-top:0}
  .fg.wide{grid-column:auto}
  .qawl{grid-template-columns:48px minmax(0,1fr)}
  .rosette{width:34px; height:34px} .rosette b{font-size:16px}
  .qb{padding:12px 12px 14px 10px}
  .jadwal{margin-inline:5px}
  .mrow{grid-template-columns:minmax(0,1fr)}
  .mmeta{justify-content:flex-start}
  .lab-2col{grid-template-columns:minmax(0,1fr)}
  .khilaf{gap:6px 12px}
}

@media (max-width:960px){
  .topbar .brand .mark{display:none}
  .brand strong{font-size:19px}
  .top-actions .btn.ghost{padding:0 10px; min-width:38px}
  .search{flex:1 1 calc(100% - 112px)}
  .notice{padding:4px 12px; font-size:12.5px}
  .notice .long{display:none} .notice .short{display:inline}
  .khilaf{position:static}
  .qdesc{font-size:calc(17.5px * var(--scale)); line-height:1.95}
  .qtext{font-size:calc(20px * var(--scale)); line-height:2}
  .quote{font-size:calc(18px * var(--scale))}
  .h-sec{margin-top:24px}
  .tray{max-height:60%}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important; scroll-behavior:auto!important} }

/* =====================================================================
   EDITOR STYLES. Utilitarian on purpose: the reading views stay manuscript-like,
   the editor reads as tooling, so the two are never confused.
   ===================================================================== */

/* ---------- top bar additions ---------- */
.savestate{display:inline-flex; align-items:center; gap:7px; font-size:13.5px; color:var(--ink-2); padding:0 6px}
.savestate i{width:8px; height:8px; border-radius:50%; background:var(--ink-3); flex:none}
.savestate.ok i{background:var(--verdigris)}
.savestate.busy i{background:var(--ochre); animation:pulse 1.1s ease-in-out infinite}
.savestate.warn i{background:var(--ochre)}
.savestate.err i{background:var(--rubric); animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
#edLink.on{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.toast.has-act{display:flex; align-items:center; gap:14px}
.toast-act{border:0; background:none; color:var(--surface); text-decoration:underline; font-size:14.5px; padding:0; flex:none}

/* ---------- editor frame ---------- */
.ed-view{max-width:1000px}
.ed-view.ed-wide{max-width:1180px}
.ed-top{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px}
.ed-tabs{display:flex; flex-wrap:wrap; gap:2px; border-bottom:1px solid var(--line)}
.ed-tabs a{padding:9px 14px; font-size:15px; color:var(--ink-2); text-decoration:none; border-bottom:2px solid transparent; margin-bottom:-1px}
.ed-tabs a:hover{color:var(--ink)}
.ed-tabs a.on{color:var(--rubric); border-bottom-color:var(--rubric); font-weight:600}
.ed-head{display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:10px 16px; margin-bottom:4px}
.ed-head.sm{margin-bottom:10px}
.ed-head h2.nb{margin:0; border:0; padding:0}
.ed-hact{display:flex; flex-wrap:wrap; gap:8px}

.ed-banner{margin:10px 0; padding:9px 14px; border-radius:6px; font-size:14.5px; line-height:1.7; display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px}
.ed-banner.note{background:var(--lapis-soft); color:var(--ink)}
.ed-banner.ok{background:var(--verdigris-soft); color:var(--ink)}
.ed-banner.warn{background:var(--ochre-soft); color:var(--ink)}
.ed-banner.err{background:var(--wajib-bg); color:var(--wajib-fg)}
.ed-banner b{font-weight:700}

/* ---------- guide ---------- */
.chain{display:flex; flex-wrap:wrap; align-items:center; gap:2px; margin:14px 0 4px; font-size:13.5px; color:var(--ink-2)}
.chain span{padding:3px 10px; border:1px solid var(--line); border-radius:999px; background:var(--surface)}
.chain i{width:16px; height:1px; background:var(--line)}
.gsteps{list-style:none; margin:18px 0; padding:0; counter-reset:g}
.gstep{display:grid; grid-template-columns:34px 1fr; gap:12px; padding:14px 0; border-top:1px solid var(--line-soft)}
.gstep:first-child{border-top:0}
.gnum{width:30px; height:30px; border-radius:50%; background:var(--sunk); color:var(--ink-2); display:grid; place-items:center; font-weight:700; font-size:14px}
.gstep.done .gnum{background:var(--verdigris); color:#fff}
.gbody h3{font-size:17px; margin:2px 0 4px}
.gbody p{margin:0 0 10px; color:var(--ink-2); font-size:14.5px; max-width:70ch}
.gact{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.warnnote{color:var(--gold-ink); font-size:13.5px; font-weight:600}
.ed-card{margin:22px 0; padding:16px 18px; background:var(--surface); border:1px solid var(--line); border-radius:8px}
.ed-card.danger-zone{border-color:var(--wajib-bar)}
.quick{display:flex; flex-wrap:wrap; gap:8px}
.stats{list-style:none; display:flex; flex-wrap:wrap; gap:8px 20px; margin:8px 0; padding:0; font-size:14px; color:var(--ink-2)}
.stats b{color:var(--ink); font-size:16px}

/* ---------- masa'il list ---------- */
.ed-filters{display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px 18px; margin:10px 0 14px}
.ed-chk{display:flex; align-items:center; gap:7px; font-size:14.5px; padding-bottom:9px}
.ed-table td, .ed-table th{white-space:nowrap}
.ed-table td:first-child{white-space:normal; min-width:220px}
.ed-table .rp{color:var(--ink-3); font-size:13.5px}
.ra{text-align:end}

/* ---------- tree manager ---------- */
.ttree,.ttree ul{list-style:none; margin:0; padding:0}
.ttree ul{margin-inline-start:20px}
.trow2{display:flex; align-items:center; gap:10px; padding:7px 4px; border-bottom:1px solid var(--line-soft)}
.tk{flex:none; font-size:12px; color:var(--ink-3); border:1px solid var(--line); border-radius:3px; padding:0 6px}
.ttl{flex:1; min-width:0; font-family:var(--font-text); font-size:18px; color:var(--ink); text-decoration:none}
.ttl:hover{color:var(--rubric)}
.cnt{flex:none; font-size:12.5px; color:var(--ink-3)}
.tacts{flex:none; display:flex; gap:4px}

/* ---------- sources ---------- */
.srclist{list-style:none; margin:14px 0; padding:0; display:grid; gap:12px}
.srccard{padding:14px 16px; background:var(--surface); border:1px solid var(--line); border-radius:8px}
.srch{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px}
.srch h2{font-family:var(--font-text); font-size:19px; font-weight:700}
.rights{font-size:12px; padding:2px 9px; border-radius:999px; border:1px solid var(--line); color:var(--ink-2); white-space:nowrap}
.rights.r-public_domain,.rights.r-licensed,.rights.r-permission{color:var(--verdigris); border-color:var(--verdigris)}
.rights.r-restricted{color:var(--rubric); border-color:var(--rubric)}
.meta{margin:2px 0 8px; font-size:13.5px; color:var(--ink-3)}
.vols{display:flex; flex-wrap:wrap; gap:8px 16px; margin:6px 0}
.vol{font-size:13.5px; color:var(--ink-2); display:flex; align-items:center; gap:6px}
.vchip{font-size:12px; padding:1px 8px; border-radius:999px; border:1px solid var(--line)}
.vchip.file{color:var(--verdigris); border-color:var(--verdigris)}
.vchip.link{color:var(--lapis); border-color:var(--lapis)}
.vchip.none{color:var(--ink-3)}
.srcf{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px; padding-top:8px; border-top:1px solid var(--line-soft); font-size:13.5px}

/* PDF attach inside the source dialog */
.ed-h3{font-size:15px; font-weight:600; margin:18px 0 8px; padding-top:12px; border-top:1px solid var(--line)}
.vollist{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.volrow{display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:8px 10px; background:var(--sunk); border-radius:6px}
.volrow>b{flex:none; min-width:64px; font-size:13.5px}
.vst{flex:1 1 220px; min-width:0; font-size:13.5px; color:var(--ink-2)}
.vact{display:flex; flex-wrap:wrap; gap:6px}
.busy{display:flex; align-items:center; gap:8px}
progress{width:90px; height:6px}

/* ---------- vocab ---------- */
.vsec{margin-top:0}
.vlist{list-style:none; margin:0; padding:0; display:grid; gap:2px}
.vrow{display:flex; align-items:center; gap:12px; padding:7px 4px; border-bottom:1px solid var(--line-soft); font-size:14.5px}
.vl{flex:1; min-width:0}
.vm{flex:none; font-size:12.5px; color:var(--ink-3)}
.indent{color:var(--ink-3)}
.swatches{display:flex; flex-wrap:wrap; gap:7px; margin-top:4px}
.sw{width:28px; height:28px; border-radius:50%; border:2px solid transparent; padding:0; display:grid; place-items:center}
.sw i{width:20px; height:20px; border-radius:50%; background:var(--tone-bar)}
.sw[aria-pressed=true]{border-color:var(--ink)}
.sw.t-wajib{--tone-bar:var(--wajib-bar)} .sw.t-sunna{--tone-bar:var(--sunna-bar)} .sw.t-mustahabb{--tone-bar:var(--mustahabb-bar)}
.sw.t-mubah{--tone-bar:var(--mubah-bar)} .sw.t-makruh{--tone-bar:var(--makruh-bar)} .sw.t-haram{--tone-bar:var(--haram-bar)}
.sw.t-c7{--tone-bar:#6B8E23} .sw.t-c8{--tone-bar:#8E6BAB}
.t-c7{--tone-bg:#EBF0DD; --tone-fg:#42551A; --tone-bar:#6B8E23}
.t-c8{--tone-bg:#EEE7F3; --tone-fg:#4E2E63; --tone-bar:#8E6BAB}
:root[data-theme="dark"] .t-c7,:root:not([data-theme="light"]) .t-c7{--tone-bg:#26301A; --tone-fg:#C3D89E; --tone-bar:#8AAE3F}
:root[data-theme="dark"] .t-c8,:root:not([data-theme="light"]) .t-c8{--tone-bg:#2C2333; --tone-fg:#D2B8E6; --tone-bar:#AD8AC7}

/* ---------- issues / lint ---------- */
.issues{list-style:none; margin:0; padding:0; display:grid; gap:5px; font-size:14px}
.issues li{padding:6px 10px; border-radius:5px; background:var(--sunk)}
.issues a{margin-inline-start:8px}
.isv{font-size:11.5px; font-weight:700; padding:1px 7px; border-radius:999px; margin-inline-end:6px}
.is-err .isv{background:var(--wajib-bg); color:var(--wajib-fg)}
.is-warn .isv{background:var(--ochre-soft); color:var(--gold-ink)}
.is-info .isv{background:var(--lapis-soft); color:var(--lapis)}
.code.inline{display:inline; padding:1px 6px}

/* ---------- forms (shared: dialogs + composer) ---------- */
.ed-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px 16px; margin:10px 0}
.ed-grid.loc{grid-template-columns:repeat(3,1fr)}
.ed-grid.c{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.ed-grid.cal-f{grid-template-columns:1fr 1fr; align-items:end}
.fld{display:flex; flex-direction:column; gap:5px; min-width:0}
.fld.wide{grid-column:1/-1}
.fl{font-size:13.5px; font-weight:600; color:var(--ink-2)}
.req{color:var(--rubric); margin-inline-start:2px}
.fh{font-size:12.5px; color:var(--ink-3)}
.ed-in{width:100%; min-height:38px; border:1px solid var(--line); background:var(--surface); border-radius:6px; padding:0 10px; font-size:15px; font-family:inherit}
.ed-in:focus{outline:none; border-color:var(--lapis); box-shadow:0 0 0 3px color-mix(in srgb, var(--lapis) 22%, transparent)}
.ed-in.arabic{font-family:var(--font-text); font-size:17px}
textarea.ed-in{min-height:auto; padding:8px 10px; line-height:1.8; resize:vertical}
select.ed-in{padding-inline-end:8px}
.selrow{display:flex; gap:6px}
.selrow select{flex:1; min-width:0}
.rad{display:flex; align-items:center; gap:6px; font-size:14px; padding:5px 0}
.kindf{border:0; padding:0; margin:0}
.kindf legend{padding:0}
.chk{display:flex; align-items:center; gap:7px; font-size:14.5px}

/* ---------- dialogs ---------- */
dialog.dlg{padding:0; border:0; border-radius:10px; box-shadow:0 20px 60px rgba(10,14,26,.35); width:min(560px, calc(100vw - 32px)); max-height:min(88vh, 900px); color:var(--ink); background:var(--surface)}
dialog.dlg.wide{width:min(880px, calc(100vw - 32px))}
dialog.dlg.small{width:min(420px, calc(100vw - 32px))}
dialog.dlg::backdrop{background:rgba(10,14,26,.5)}
dialog.dlgc{z-index:2}
.dlg-in{display:flex; flex-direction:column; max-height:min(88vh, 900px)}
.dlg-h{flex:none; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line)}
.dlg-h h2{font-size:18px; font-weight:700}
.dlg-b{flex:1; min-height:0; overflow:auto; padding:16px}
.dlg-b.ed-root{padding:16px}
.dlg-p{margin:0 0 4px; font-size:15px; line-height:1.8; color:var(--ink-2)}
.dlg-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.dlg-f{flex:none; display:flex; align-items:center; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--sunk)}
.dlg-err{flex:1; min-width:0; color:var(--rubric); font-size:13.5px}
.btn.danger{background:var(--rubric); border-color:var(--rubric); color:var(--on-rubric)}
.btn.danger:hover{filter:brightness(1.05)}
.btn.danger.sm{background:transparent; color:var(--rubric); border-color:var(--rubric)}

/* picker list (used by "link masa'ala", "add citation from home") */
.picklist{list-style:none; margin:10px 0 0; padding:0; display:grid; gap:4px; max-height:46vh; overflow:auto}
.pick{display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; text-align:start; padding:9px 10px; border:1px solid var(--line); background:var(--surface); border-radius:6px; font-size:14.5px}
.pick:hover{border-color:var(--lapis)}
.pick small{color:var(--ink-3); font-size:12.5px}

/* PDF calibration / capture inside dialogs */
.folio.cal{max-width:520px; margin-inline:auto}
.rectinfo{font-size:13.5px; color:var(--ink-2); margin:8px 2px 0; text-align:center}
.rectinfo .ok{color:var(--verdigris)}

/* ---------- composer ---------- */
.ed-bar{position:sticky; top:0; z-index:8; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; background:var(--ground); border-bottom:1px solid var(--line); margin-bottom:10px}
.ed-bar-t{display:flex; align-items:center; gap:6px; font-size:14.5px; color:var(--ink-2)}
.ed-bar-t a{color:var(--lapis); text-decoration:none}
.ed-bar-a{display:flex; flex-wrap:wrap; gap:8px}
.dirty{color:var(--gold-ink); font-size:13px; margin-inline-start:8px}
.ed-errors{margin:10px 0; padding:12px 16px; background:var(--wajib-bg); color:var(--wajib-fg); border-radius:8px}
.ed-errors ul{margin:6px 0 0; padding-inline-start:18px}
.ed-errors button{background:none; border:0; padding:0; color:inherit; text-decoration:underline; font-size:14px; cursor:pointer}

.comp{display:grid; grid-template-columns:220px minmax(0,1fr); gap:26px; align-items:start}
.ed-guide{position:sticky; top:64px; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px 14px}
.ed-guide h2{font-size:13.5px; color:var(--ink-3); margin-bottom:8px}
.ed-guide ol{list-style:none; margin:0; padding:0; display:grid; gap:2px}
.ed-guide li button{display:flex; align-items:flex-start; gap:8px; width:100%; text-align:start; background:none; border:0; padding:6px 4px; font-size:13.5px; color:var(--ink-2); border-radius:5px}
.ed-guide li button:hover{background:var(--sunk)}
.ed-guide li.ok button{color:var(--ink)}
.ed-guide li.opt button{color:var(--ink-3)}
.ed-guide .ck{flex:none; width:16px; height:16px; border-radius:50%; border:1.5px solid var(--line); display:grid; place-items:center; color:#fff; margin-top:1px}
.ed-guide li.ok .ck{background:var(--verdigris); border-color:var(--verdigris)}
.ed-guide li.ok .ck svg{width:10px; height:10px}
.ed-guide small{color:var(--ink-3)}

.ed-sec{padding:18px 0; border-top:1px solid var(--line)}
.ed-sec:first-child{border-top:0; padding-top:0}
.ed-sec h2{font-size:17px; font-weight:700; margin-bottom:4px}
.ed-sec>.hint{margin-bottom:10px}

.ed-q{margin:14px 0; padding:14px 16px; background:var(--surface); border:1px solid var(--line); border-inline-start:4px solid var(--tone-bar); border-radius:6px}
.ed-qh{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px}
.ed-qh h3{font-size:16px}
.ed-qtools{display:flex; gap:6px}
.ed-sub{border:0; margin:14px 0 0; padding:12px 0 0; border-top:1px dashed var(--line-soft)}
.ed-sub legend{padding:0 0 6px; font-size:13.5px; font-weight:600; color:var(--ink-2)}
.hrow,.lrow{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:8px}
.hrow .selrow{flex:1 1 220px}
.hrow .ed-in{flex:1 1 160px; min-width:0}
.lrow .ed-in,.lrow select{flex:1 1 180px; min-width:0}
.rrow{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:8px}
.rrow select{flex:1 1 160px}
.pickbtn{flex:1 1 220px; text-align:start; min-width:0}

.ed-c{margin:10px 0; padding:12px; background:var(--sunk); border-radius:6px}
.ed-c-foot{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:8px; padding-top:8px; border-top:1px dashed var(--line-soft)}
.ed-pdf{display:flex; flex-wrap:wrap; align-items:center; gap:8px; flex:1}
.ed-snip{flex-basis:100%; margin-top:6px}
.ed-snip img.snip{max-width:280px}
.stale{color:var(--gold-ink); font-size:12.5px; font-weight:600}
.nocite{color:var(--ink-3); font-size:14.5px; margin:6px 0}

.tchips{display:flex; flex-wrap:wrap; gap:14px 10px; margin:4px 0}
.tgrp{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding-inline-end:14px; border-inline-end:1px solid var(--line-soft)}
.tgrp:last-child{border-inline-end:0}
.tchip{display:inline-flex; align-items:center; gap:6px; font-size:14px; padding:3px 10px; border:1px solid var(--line); border-radius:999px; cursor:pointer}
.tchip input{margin:0}
.kwchips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px}
.kwchip{display:inline-flex; align-items:center; gap:6px; font-size:13.5px; padding:2px 6px 2px 10px; border:1px dashed var(--line); border-radius:999px}
.kwchip button{border:0; background:none; color:var(--ink-3); font-size:15px; line-height:1; padding:0 2px; cursor:pointer}
.ed-inline{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0}
.ed-inline.sm{margin-top:10px}
.side-ed{display:flex; flex-wrap:wrap; gap:8px; padding:10px 14px}
.side-empty{padding:6px 14px; color:var(--ink-3); font-size:13.5px}

@media (max-width:960px){
  .comp{grid-template-columns:1fr}
  .ed-guide{position:static}
  .ed-grid.loc{grid-template-columns:1fr}
  .ed-bar{position:static}
  dialog.dlg{width:calc(100vw - 20px)}
}

</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="icon-btn only-narrow" data-action="toggle-tree" aria-label="فتح الفهرس">
      <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>

      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8" y="8" width="24" height="24"/><rect x="8" y="8" width="24" height="24" transform="rotate(45 20 20)"/></g><circle cx="20" cy="20" r="3.4" fill="currentColor"/></svg>
      <span><strong>المكتبة الفقهية المالكية</strong></span>
    </a>
    <div class="search" role="search">
      <span class="ic"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>

      <a class="btn ghost" href="#/saved" aria-label="المحفوظات"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M10 2.6l2.3 4.7 5.2.7-3.8 3.6.9 5.1L10 14.2l-4.6 2.5.9-5.1L2.5 8l5.2-.7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span class="bt">المحفوظات</span><span class="badge" id="savedCount" hidden></span></a>

      <button class="icon-btn" id="gearBtn" data-action="toggle-settings" aria-haspopup="true" aria-expanded="false" aria-label="إعدادات العرض"><svg viewBox="0 0 20 20" width="19" height="19" aria-hidden="true"><circle cx="10" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
    </nav>
  </header>
    <section id="tray" class="tray" hidden aria-label="تصفية بالوسوم"></section>
  <div class="shell" id="shell">
    <aside id="side" class="side" aria-label="الفهرس"></aside>
    <main id="main" class="main" tabindex="-1"><div class="view"><p class="muted">جارٍ تحميل المكتبة…</p></div></main>

  <div id="scrim" class="scrim" data-action="scrim" hidden></div>

  <dialog id="dlgc" class="dlg dlgc" aria-modal="true"></dialog>

<script>
(function () {
'use strict';

/* ===== config ===== */
/* ===== build configuration (filled in by build.py) ===== */
const EDITOR = true;                // the editing UI is part of this build
const SAMPLE_MODE = false;      // demo build: starts with the placeholder library
const SERVER_PROBE = true;    // try to talk to server.py (local build only)
const PDFJS_BASE = "vendor/";
const PDFJS_OPTS = {"cMapUrl": "vendor/cmaps/", "cMapPacked": true, "standardFontDataUrl": "vendor/standard_fonts/"};
const INITIAL_DOC = null;      // the library a brand-new browser profile starts with (null = empty)

/* ---------- Arabic search normalisation ----------
   Light normalisation (same idea as Lucene's Arabic filter):
   drop harakat / tatweel / bidi marks, unify alef forms, ى→ي, ة→ه, digits→ASCII.
   normMap keeps a map back to the ORIGINAL string so <mark> highlights stay correct
   even when the source text is fully vocalised and the query is not. */
function foldChar(ch) {
  const c = ch.charCodeAt(0);
  if (c === 0x640) return '';                                                     // tatweel
  if ((c >= 0x64B && c <= 0x65F) || c === 0x670 || (c >= 0x610 && c <= 0x61A) || (c >= 0x6D6 && c <= 0x6ED)) return '';  // harakat, Quranic marks

  if (c === 0x622 || c === 0x623 || c === 0x625 || c === 0x671) return '\u0627';  // آ أ إ ٱ → ا
  if (c === 0x649 || c === 0x6CC) return '\u064A';                                // ى ی → ي

  if (c === 0x6A9) return '\u0643';                                               // ک → ك

   Deliberately NOT stripping bare و/ب/ل/ف/ك: they are often root letters and it would wreck precision.

/* returns SAFE html with <mark> around every token hit, in the original (vocalised) text */
function highlight(text, toks) {
  const src = String(text == null ? '' : text);

  const { norm, map, end } = normMap(src);

  for (const t of toks) {
    if (!t) continue;
    let from = 0, i;
    while ((i = norm.indexOf(t, from)) >= 0) { ranges.push([map[i], end[i + t.length - 1]]); from = i + t.length; }
  }
  if (!ranges.length) return esc(src);
  ranges.sort((a, b) => a[0] - b[0]);

  for (let k = 1; k < ranges.length; k++) {

/* ===== model.js ===== */
/* =====================================================================

   Everything the views read (NODE, MAS, CITES, EDITIONS ...) is DERIVED from it by loadLibrary(),
   which refills the containers IN PLACE, so every existing reference keeps working after an edit.

   DOC = { v, vocab:{hukm[],roles[],labels[]}, scholars[], editions[], assets[], tags[], nodes[], masail[] }

const DOC_VERSION = 1;
const TONES = ['wajib', 'sunna', 'mustahabb', 'mubah', 'makruh', 'haram', 'c7', 'c8'];
const KIND_AR = { kitab: 'كتاب', bab: 'باب', fasl: 'فصل' };

/* containers (refilled in place by loadLibrary) */
const SCHOLARS = {}, EDITIONS = {}, ASSETS = {}, HK = {}, TAG = {}, NODE = {}, MAS = {}, CITES = {};
const HUKM = [], TAGS = [], NODES = [], MASAIL = [], ROOTS = [], RELS = [];
const VOCAB = { roles: [], labels: [] };

const clearObj = o => { for (const k in o) delete o[k]; };
const clone = o => JSON.parse(JSON.stringify(o));
let _uidN = 0;
const uid = p => p + Date.now().toString(36) + (++_uidN).toString(36) + Math.random().toString(36).slice(2, 5);
/* «٣٥» «35» «۳۵» → 35 ; anything else → null */
const toInt = v => {
  const s = String(v == null ? '' : v).replace(/[\u0660-\u0669\u06F0-\u06F9]/g, ch => String(digitVal(ch))).replace(/[^\d]/g, '');
  return s === '' ? null : parseInt(s, 10);
};

/* ---------- a fresh, empty library. The vocabularies are EDITABLE defaults, not assertions. ---------- */
function emptyDoc() {
  return {
    v: DOC_VERSION,
    vocab: {
      hukm: [
        { id: 'h1', label: 'واجب', tone: 'wajib' }, { id: 'h2', label: 'سنة', tone: 'sunna' },
        { id: 'h3', label: 'مستحب', tone: 'mustahabb' }, { id: 'h4', label: 'مباح', tone: 'mubah' },
        { id: 'h5', label: 'مكروه', tone: 'makruh' }, { id: 'h6', label: 'حرام', tone: 'haram' }
      ],
      roles: ['قال به', 'نقله', 'رجّحه'],
      labels: ['المشهور', 'الراجح', 'المعتمد']
    },
    scholars: [], editions: [], assets: [], tags: [], nodes: [], masail: []
  };
}

/* ---------- defensive normalisation: fills defaults, repairs what can be repaired, reports what it did ---------- */
function normalizeDoc(d) {
  const fixes = [], E = emptyDoc();
  if (!d || typeof d !== 'object') d = E;
  d.v = d.v || DOC_VERSION;
  d.vocab = d.vocab || {};
  ['hukm', 'roles', 'labels'].forEach(k => { if (!Array.isArray(d.vocab[k])) d.vocab[k] = E.vocab[k]; });
  ['scholars', 'editions', 'assets', 'tags', 'nodes', 'masail'].forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
  const nodeIds = new Set(d.nodes.map(n => n.id));
  let orphanRoot = null;
  d.masail.forEach(m => {
    m.topics = m.topics || []; m.hal = m.hal || []; m.kw = m.kw || []; m.related = m.related || []; m.qawls = m.qawls || [];
    m.status = m.status || 'draft'; m.situation = m.situation || '';
    if (!nodeIds.has(m.node)) {                        // dangling location: park it somewhere visible instead of losing it
      if (!orphanRoot) { orphanRoot = { id: uid('n'), kind: 'kitab', title: 'غير مصنَّف', parent: null }; d.nodes.push(orphanRoot); nodeIds.add(orphanRoot.id); }
      m.node = orphanRoot.id; fixes.push('نُقلت مسألة «' + (m.title || m.id) + '» إلى «غير مصنَّف» لأن موضعها مفقود');
    }
    m.qawls.forEach(q => { q.holders = q.holders || []; q.cites = q.cites || []; q.labels = q.labels || []; q.kind = q.kind || 'verbatim'; q.status = q.status || 'draft'; q.note = q.note || ''; });
  });
  return { doc: d, fixes };
}

/* ---------- validation for IMPORTED documents: returns human-readable errors (empty = fine) ---------- */
function validateDoc(d) {
  const err = [];
  if (!d || typeof d !== 'object' || Array.isArray(d)) return ['الملف ليس مكتبة صالحة (يجب أن يكون كائن JSON)'];
  if (d.v && d.v > DOC_VERSION) err.push('هذا الملف من إصدار أحدث من هذا البرنامج');
  const need = ['vocab', 'scholars', 'editions', 'nodes', 'masail'];
  need.forEach(k => { if (d[k] == null) err.push('الحقل «' + k + '» مفقود'); });
  if (err.length) return err;
  const ids = (arr, what) => { const s = new Set(); (arr || []).forEach(x => { if (!x || x.id == null) err.push(what + ': عنصر بلا معرّف'); else if (s.has(x.id)) err.push(what + ': معرّف مكرر «' + x.id + '»'); else s.add(x.id); }); return s; };
  const hk = ids(d.vocab && d.vocab.hukm, 'أنواع الحكم'), sc = ids(d.scholars, 'العلماء'), ed = ids(d.editions, 'المصادر');
  const tg = ids(d.tags, 'الوسوم'), nd = ids(d.nodes, 'الفهرس'), ms = ids(d.masail, 'المسائل'); ids(d.assets, 'الملفات');
  (d.nodes || []).forEach(n => { if (n.parent && !nd.has(n.parent)) err.push('الفهرس: «' + n.title + '» أبوه غير موجود'); if (!KIND_AR[n.kind]) err.push('الفهرس: نوع غير معروف «' + n.kind + '»'); });
  (d.assets || []).forEach(a => { if (!ed.has(a.ed)) err.push('ملف يشير إلى مصدر غير موجود'); });
  (d.masail || []).forEach(m => {
    const at = '«' + (m.title || m.id) + '»';
    if (!nd.has(m.node)) err.push('المسألة ' + at + ': موضعها في الفهرس غير موجود');
    (m.topics || []).concat(m.hal || []).forEach(t => { if (!tg.has(t)) err.push('المسألة ' + at + ': وسم غير موجود'); });
    (m.related || []).forEach(r => { if (!ms.has(r.to)) err.push('المسألة ' + at + ': مسألة مرتبطة غير موجودة'); });
    (m.qawls || []).forEach(q => {
      if (!hk.has(q.hukm)) err.push('المسألة ' + at + ': نوع حكم غير موجود');
      (q.holders || []).forEach(h => { if (!sc.has(h.s)) err.push('المسألة ' + at + ': عالم غير موجود'); });
      const cids = new Set((q.cites || []).map(c => c.id));
      (q.cites || []).forEach(c => { if (!ed.has(c.ed)) err.push('المسألة ' + at + ': دليل يشير إلى مصدر غير موجود'); });
      (q.labels || []).forEach(l => { if (!cids.has(l.cite)) err.push('المسألة ' + at + ': ترجيح بلا دليل من أدلة القول'); if (!sc.has(l.by)) err.push('المسألة ' + at + ': ترجيح لعالم غير موجود'); });
    });
  });
  return err.slice(0, 30);
}

/* ---------- derivation ---------- */
function assetFor(ed, vol) {
  const E = EDITIONS[ed]; if (!E) return null;
  for (const id of E.assets) { const a = ASSETS[id]; if (a && (a.vol || 1) === (vol || 1)) return a; }
  return null;
}
/* The tier is DERIVED, never stored: upgrading a citation (linking a file, drawing a box) needs no migration.
   A rectangle only counts if it was drawn on the CURRENT file for that volume. */
function citeTier(c) {
  const a = assetFor(c.ed, c.vol);
  if (!a) return 'text';
  if (a.kind === 'link') return 'link';
  return c.rect && c.asset === a.id ? 'exact' : 'page';
}
function deriveCite(c) {
  if (!EDITIONS[c.ed]) EDITIONS[c.ed] = { id: c.ed, title: '(مصدر محذوف)', author: '', editor: '', volumes: 1, rights: 'unknown', assets: [] };
  const a = assetFor(c.ed, c.vol), tier = citeTier(c);
  return {
    id: c.id, ed: c.ed, vol: c.vol || 1, page: c.page, pageEnd: c.pageEnd || null,
    bab: c.bab || '', fasl: c.fasl || '', quote: c.quote || null,
    asset: a ? a.id : null, tier, rect: tier === 'exact' ? c.rect : null,
    stale: !!(c.rect && a && a.kind === 'file' && c.asset !== a.id),     // drawn on a file that has since been replaced
    pdfPage: a ? (Number(c.page) || 0) + (a.offset || 0) : null
  };
}
function deriveMasala(mm) {
  const m = {
    id: mm.id, node: mm.node, title: mm.title, q: mm.situation || '', status: mm.status || 'draft',
    topics: (mm.topics || []).filter(t => TAG[t]), hal: (mm.hal || []).filter(t => TAG[t]), kw: (mm.kw || []).slice(),
    related: (mm.related || []).map(r => [r.to, r.type]), qawls: []
  };
  (mm.qawls || []).forEach((qq, i) => {
    if (!HK[qq.hukm]) HK[qq.hukm] = { id: qq.hukm, label: 'غير محدد', tone: 'mubah', cls: 't-mubah' };
    const q = { id: qq.id, n: i + 1, hukm: qq.hukm, text: qq.text || '', kind: qq.kind || 'verbatim', status: qq.status || 'draft', note: qq.note || null,
                holders: (qq.holders || []).filter(h => SCHOLARS[h.s]).map(h => ({ s: h.s, role: h.role })), cites: [], labels: [] };
    (qq.cites || []).forEach(cc => { const ct = deriveCite(cc); q.cites.push(ct); CITES[ct.id] = ct; });
    (qq.labels || []).forEach(l => { const ct = CITES[l.cite]; if (ct && SCHOLARS[l.by]) q.labels.push({ t: l.t, by: l.by, cite: ct }); });
    m.qawls.push(q);
  });
  return m;
}

/* search index: normalised fields per mas'ala (title, situation, keywords, tags, every qawl, holders, labels, citations, quotes) */
function indexMasala(m) {
  const fields = [];
  const add = (label, text) => { if (text) fields.push({ label, text, n: normalize(text) }); };
  add('العنوان', m.title); add('صورة المسألة', m.q); add('كلمات مفتاحية', m.kw.join(' '));
  add('الوسوم', [...m.topics, ...m.hal].map(t => TAG[t].label).join(' '));
  m.qawls.forEach(q => {
    add('القول ' + ordQawl(q.n), q.text);
    add('نوع الحكم', HK[q.hukm].label);
    q.holders.forEach(h => add('القائلون', SCHOLARS[h.s].name + ' ' + h.role));
    q.labels.forEach(l => add('الترجيح', l.t));
    q.cites.forEach(c => { add('العزو', EDITIONS[c.ed].title + ' ' + c.bab + ' ' + c.fasl); if (c.quote) add('النص المنقول', c.quote); });
  });
  m._f = fields; m._hay = fields.map(f => f.n).join(' \u0001 ');
}

function loadLibrary(doc) {
  DOC = doc;
  clearObj(SCHOLARS); doc.scholars.forEach(s => { SCHOLARS[s.id] = { id: s.id, name: s.name }; });
  clearObj(EDITIONS);
  doc.editions.forEach(e => { EDITIONS[e.id] = Object.assign({ author: '', editor: '', publisher: '', year: '', note: '', rights: 'unknown', rightsNote: '', death: null, volumes: 1 }, e, { assets: [] }); });
  clearObj(ASSETS);
  doc.assets.forEach(a => { ASSETS[a.id] = Object.assign({ offset: 0, vol: 1 }, a); if (EDITIONS[a.ed]) EDITIONS[a.ed].assets.push(a.id); });
  HUKM.length = 0; clearObj(HK);
  doc.vocab.hukm.forEach(h => { const o = { id: h.id, label: h.label, tone: h.tone, cls: 't-' + h.tone }; HUKM.push(o); HK[h.id] = o; });
  VOCAB.roles = doc.vocab.roles.slice(); VOCAB.labels = doc.vocab.labels.slice();
  TAGS.length = 0; clearObj(TAG);
  doc.tags.forEach(t => { const o = { id: t.id, group: t.group, label: t.label, parent: t.parent || null }; TAGS.push(o); TAG[t.id] = o; });

  NODES.length = 0; clearObj(NODE);
  doc.nodes.forEach(n => {
    const o = { id: n.id, kind: KIND_AR[n.kind] || n.kind, cls: n.kind, title: n.title, parent: n.parent || null };
    NODES.push(o); NODE[n.id] = Object.assign({}, o, { children: [], masail: [], total: 0 });
  });
  NODES.forEach(n => { if (n.parent && NODE[n.parent]) NODE[n.parent].children.push(n.id); });
  ROOTS.length = 0; NODES.filter(n => !n.parent).forEach(n => ROOTS.push(n.id));

  MASAIL.length = 0; clearObj(MAS); clearObj(CITES); RELS.length = 0;
  doc.masail.forEach(mm => { const m = deriveMasala(mm); MASAIL.push(m); MAS[m.id] = m; if (NODE[m.node]) NODE[m.node].masail.push(m.id); });
  const walk = id => { const n = NODE[id]; n.total = n.masail.length + n.children.reduce((a, c) => a + walk(c), 0); return n.total; };
  ROOTS.forEach(walk);
  MASAIL.forEach(m => m.related.forEach(([to, type]) => { if (MAS[to]) RELS.push({ from: m.id, to, type }); }));
  MASAIL.forEach(indexMasala);
}

/* ===== store.js ===== */
/* =====================================================================
   STORE: keeps the library document (DOC) and the PDF files somewhere durable.
   Same UI, three backends, chosen at start-up:
     'server'  server.py keeps data/library.json + data/pdfs/ on disk (recommended: real files you can back up / put in git)
     'browser' IndexedDB in this browser (no install; export backups, because clearing site data erases it)
     'memory'  nothing survives a reload (sandboxed frames where IndexedDB is blocked)
   ===================================================================== */
const IDBS = {
  _p: null,
  open() {
    if (this._p) return this._p;
    this._p = new Promise((res, rej) => {
      try {
        if (typeof indexedDB === 'undefined') return rej(new Error('IndexedDB غير متاح'));
        const rq = indexedDB.open('mfl-library', 1);
        rq.onupgradeneeded = () => { const db = rq.result; db.createObjectStore('kv'); db.createObjectStore('pdf'); };
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => rej(rq.error || new Error('تعذّر فتح IndexedDB'));
        rq.onblocked = () => rej(new Error('IndexedDB محجوب'));
      } catch (e) { rej(e); }
    });
    this._p.catch(() => { this._p = null; });
    return this._p;
  },
  async tx(store, mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode), r = fn(t.objectStore(store));
      t.oncomplete = () => res(r && r.result);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  get(store, key) { return this.tx(store, 'readonly', s => s.get(key)); },
  put(store, key, val) { return this.tx(store, 'readwrite', s => s.put(val, key)); },
  del(store, key) { return this.tx(store, 'readwrite', s => s.delete(key)); }
};

function xhrUpload(url, file, onProgress) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('POST', url);
    x.setRequestHeader('X-MFL', '1'); x.setRequestHeader('X-Filename', encodeURIComponent(file.name || 'file.pdf'));
    x.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
    x.onload = () => {
      if (x.status >= 200 && x.status < 300) { try { res(JSON.parse(x.responseText)); } catch (e) { rej(new Error('رد غير صالح من الخادم')); } }
      else { let m = ''; try { m = JSON.parse(x.responseText).error; } catch (e) { /* not json */ } rej(new Error(m || ('HTTP ' + x.status))); }
    };
    x.onerror = () => rej(new Error('انقطع الاتصال بالخادم'));
    x.send(file);
  });
}
async function sha256Hex(buf) {
  try {
    if (crypto && crypto.subtle) {
      const h = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) { /* insecure context */ }
  return uid('f');          // no hashing available: a random id is still unique
}

const Lib = {
  mode: 'memory', dataDir: '', rev: null, status: 'idle', error: '', lastSaved: null, fixes: [],
  version: 0, savedVersion: 0, _saveT: null, _saving: false, _force: false, _retryT: null,
  history: [], memBlobs: {},

  async init() {
    let doc = null;
    if (SERVER_PROBE && /^https?:$/.test(location.protocol)) {
      try {
        const r = await fetch('api/ping', { cache: 'no-store' });
        if (r.ok) { const p = await r.json(); if (p && p.app === 'mfl') { this.mode = 'server'; this.dataDir = p.dataDir || ''; } }
      } catch (e) { /* not served by server.py: fall through to browser storage */ }
    }
    if (this.mode === 'server') {
      const r = await fetch('api/library', { cache: 'no-store' });
      if (!r.ok) throw new Error('تعذّر قراءة المكتبة من الخادم (HTTP ' + r.status + ')');
      const j = await r.json(); this.rev = j.rev; doc = j.doc;
    } else {
      try { doc = await IDBS.get('kv', 'library'); this.mode = 'browser'; }
      catch (e) { this.mode = 'memory'; this.error = String((e && e.message) || e); }
    }

  /* every change goes through commit(): snapshot for undo, mutate, re-derive, save, re-render */

    const after = JSON.stringify(DOC);

  /* replace the whole library (import, restore, reset). The server keeps a backup first. */
  replace(doc) {

      this.setStatus('saved', '');
    } catch (e) {
      this._saving = false;
      this.setStatus('error', String((e && e.message) || e));
      this._retryT = setTimeout(() => this.flush(), 5000);           // keep trying; the banner tells the editor meanwhile
    }
  },

  /* ---------- PDF files ---------- */
  async storePdf(file, onProgress) {
    if (this.mode === 'server') {
      const r = await xhrUpload('api/upload', file, onProgress);
      return { sha: r.sha, bytes: r.bytes, name: file.name, src: 'server', url: r.url };

  },
  async getPdfBlob(sha) {
    if (this.memBlobs[sha]) return this.memBlobs[sha];
    try { return await IDBS.get('pdf', sha); } catch (e) { return null; }
  }
};

/* ===== pdfview.js ===== */
/* =====================================================================
   PDF layer, built around ASSETS (one digital copy of one volume).
   - pdf.js is loaded lazily, only when someone opens a source. pdf.worker.min.js is loaded as a plain <script> FIRST:
     when window.pdfjsWorker exists, pdf.js runs its "worker" on the main thread, so no Worker/blob: permission is needed.
   - An asset's bytes come from: 'server' (a URL served by server.py, range requests), 'idb' (a Blob in this browser),
     or 'embedded' (the synthetic sample PDF used by the demo and the lab).
   ===================================================================== */
const PDF = { lib: null, libP: null, docs: {}, infos: {}, info: null, mode: '—' };

const BLOBURLS = {};

    s.src = src; s.async = true;

    document.head.appendChild(s);

function loadPdfJs() {

    PDF.libP = (async () => {
      const t0 = performance.now();
      await Promise.all([loadScript(PDFJS_BASE + 'pdf.worker.min.js'), loadScript(PDFJS_BASE + 'pdf.min.js')]);
      const lib = window.pdfjsLib;
      if (!lib) throw new Error('pdfjsLib غير متاح بعد التحميل');
      lib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.js';
      PDF.lib = lib; PDF.mode = window.pdfjsWorker ? 'خيط الصفحة الرئيسي' : 'Worker';
      labLog('ok', `PDF.js ${lib.version} جاهز خلال ${Math.round(performance.now() - t0)} م.ث — الوضع: ${PDF.mode}`);
      try { fillEnv(); } catch (e) { /* lab not mounted */ }
      return lib;
    })().catch(e => { PDF.libP = null; labLog('err', e.message); throw new Error('تعذّر تحميل عارض PDF (انقطاع الاتصال أو سياسة أمان الصفحة). يبقى العزو النصي كاملًا.'); });
  }

}

  const bin = atob(b64), out = new Uint8Array(bin.length);

}
async function assetSource(a) {
  if (a.src === 'embedded') return { data: b64ToBytes(SAMPLE_PDF_B64) };
  if (a.src === 'server') return { url: a.url };
  if (a.src === 'idb') {
    const blob = await Lib.getPdfBlob(a.sha);

async function readDocInfo(doc) {

  try { outline = await doc.getOutline(); } catch (e) { /* none */ }

function getPdf(assetId) {
  if (!PDF.docs[assetId]) {

      const a = getAsset(assetId); if (!a) throw new Error('الملف غير موجود');
      const doc = await lib.getDocument(Object.assign({ isEvalSupported: false, useSystemFonts: true }, PDFJS_OPTS, await assetSource(a))).promise;
      PDF.infos[assetId] = PDF.info = await readDocInfo(doc);
      labLog('ok', `تم فتح الملف: ${doc.numPages} صفحات — أرقام الصفحات في الملف: ${PDF.info.labels ? JSON.stringify(PDF.info.labels.slice(0, 12)) : 'لا يوجد'} — الفهرس المضمَّن: ${PDF.info.outline ? PDF.info.outline.length + ' عناصر' : 'لا يوجد'}`);

}

  if (p) p.then(d => { try { d.destroy(); } catch (e) { /* noop */ } }).catch(() => {});

/* open a file only to learn what it is (page count, page labels, outline), then let it go */
async function probePdf(src) {

  const doc = await lib.getDocument(Object.assign({ isEvalSupported: false, useSystemFonts: true }, PDFJS_OPTS, src)).promise;
  const info = await readDocInfo(doc);

/* if the file carries its own page labels, find the PDF page whose label is "1": that gives the printed→PDF offset */
function offsetFromLabels(labels) {
  if (!labels) return null;
  const i = labels.findIndex(l => String(l).trim() === '1');
  return i >= 0 ? i : null;

/* a URL a browser tab can open natively (for the secondary "open in browser viewer" button) */
async function assetNativeUrl(a) {
  if (a.src === 'server') return new URL(a.url, location.href).href;
  if (a.src === 'embedded') return pdfBlobUrl();
  const key = a.sha;
  if (!BLOBURLS[key]) { const blob = await Lib.getPdfBlob(a.sha); if (!blob) throw new Error('الملف غير موجود'); BLOBURLS[key] = URL.createObjectURL(blob); }
  return BLOBURLS[key];
}
function pdfBlobUrl() {
  if (!BLOBURLS.__sample) BLOBURLS.__sample = URL.createObjectURL(new Blob([b64ToBytes(SAMPLE_PDF_B64)], { type: 'application/pdf' }));
  return BLOBURLS.__sample;

/* ---------- page maths ----------
   Everything stored about a position is a NORMALISED rectangle [x,y,w,h], 0..1, origin top-left.
   It survives any zoom / DPR / container width. Native `#zoom=scale,left,top` (lab only) wants PDF user space. */
const printedOf = (pdfPage, offset) => pdfPage - (offset == null ? SAMPLE_INFO.offset : offset);
const assetPages = a => (a && (a.pages || (PDF.infos[a.id] && PDF.infos[a.id].pages))) || 0;
function pageLabel(p, offset, total) {
  const pr = printedOf(p, offset), tail = total ? ` من ${D(total)}` : '';
  return pr >= 1 ? `ص ${D(pr)} (${D(p)}${tail} في الملف)` : `تمهيد غير مرقَّم (${D(p)}${tail} في الملف)`;
}
function nativeFragment(pdfPage, rect, withZoom) {
  let f = '#page=' + pdfPage;
  if (withZoom && rect) {
    const [W, H] = SAMPLE_INFO.page;
    f += `&zoom=100,${Math.round(rect[0] * W)},${Math.round((1 - rect[1]) * H)}`;
  }

/* ---------- PageView: one canvas + highlight overlay (+ optional drag-to-capture) ---------- */
class PageView {
  constructor(host, opts = {}) {
    this.host = host; this.opts = opts; this.asset = opts.asset || '__sample'; this.page = 1; this.rects = []; this.token = 0; this.task = null; this.capture = false;
    host.innerHTML = '<div class="pv" dir="ltr"><canvas></canvas><div class="pv-ov"></div><div class="pv-msg" hidden></div></div>';
    this.pv = host.firstElementChild; this.cv = this.pv.querySelector('canvas');
    this.ov = this.pv.querySelector('.pv-ov'); this.msgEl = this.pv.querySelector('.pv-msg');
    this._bindCapture();
    if (typeof ResizeObserver !== 'undefined') {
      let t; this._ro = new ResizeObserver(() => { clearTimeout(t); t = setTimeout(() => { if (this._w && Math.abs(this._w - this._width()) > 8) this.show(this.page, this.rects, { scroll: false }); }, 120); });
      this._ro.observe(host);
    }
  }
  destroy() { this.token++; if (this._ro) this._ro.disconnect(); if (this.task) { try { this.task.cancel(); } catch (e) { /* noop */ } } }
  _width() { return Math.max(240, Math.floor(this.host.clientWidth || 360)); }
  msg(text, isErr) { this.msgEl.hidden = !text; this.msgEl.textContent = text || ''; this.msgEl.classList.toggle('err', !!isErr); }
  setRects(rects) { this.rects = rects; this._drawRects(); }
  _drawRects() {
    this.ov.innerHTML = this.rects.map(r => `<div class="hl" style="left:${r[0] * 100}%;top:${r[1] * 100}%;width:${r[2] * 100}%;height:${r[3] * 100}%"></div>`).join('');
  }
  async show(pageNo, rects = [], { scroll = true } = {}) {
    this.page = pageNo; this.rects = rects; const my = ++this.token;
    this.msg('جارٍ تحميل عارض PDF…');
    try {
      const doc = await getPdf(this.asset); if (my !== this.token) return;
      if (pageNo < 1 || pageNo > doc.numPages) { this.msg('لا توجد صفحة PDF بهذا الرقم في الملف (' + D(pageNo) + ' من ' + D(doc.numPages) + ')', true); return; }
      const pg = await doc.getPage(pageNo); if (my !== this.token) return;
      const width = this._width(); this._w = width;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const vp1 = pg.getViewport({ scale: 1 });
      const vp = pg.getViewport({ scale: (width / vp1.width) * dpr });
      if (this.task) { try { this.task.cancel(); } catch (e) { /* noop */ } }
      this.cv.width = Math.floor(vp.width); this.cv.height = Math.floor(vp.height);
      this.cv.style.width = width + 'px'; this.cv.style.height = Math.floor(vp.height / dpr) + 'px';
      this.task = pg.render({ canvasContext: this.cv.getContext('2d'), viewport: vp });
      try { await this.task.promise; } catch (e) { if (e && e.name === 'RenderingCancelledException') return; throw e; }
      if (my !== this.token) return;
      this.msg(null); this._drawRects();
      if (scroll && this.rects.length) { const el = this.ov.firstElementChild; if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
      if (this.opts.onRendered) this.opts.onRendered(pageNo, doc.numPages);
    } catch (e) { if (my === this.token) { this.msg(e.message || 'تعذّر عرض الصفحة', true); labLog('err', 'عرض الصفحة: ' + (e.message || e)); } }
  }
  setCapture(on) { this.capture = !!on; this.ov.classList.toggle('cap', this.capture); }
  _bindCapture() {
    let start = null, box = null;
    const pt = e => { const b = this.ov.getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - b.left) / b.width)), Math.min(1, Math.max(0, (e.clientY - b.top) / b.height))]; };
    this.ov.addEventListener('pointerdown', e => {
      if (!this.capture) return; start = pt(e); this.ov.setPointerCapture(e.pointerId);
      this.ov.innerHTML = '<div class="hl"></div>'; box = this.ov.firstElementChild;
    });
    this.ov.addEventListener('pointermove', e => {
      if (!start) return; const p = pt(e);
      const x = Math.min(start[0], p[0]), y = Math.min(start[1], p[1]), w = Math.abs(p[0] - start[0]), h = Math.abs(p[1] - start[1]);
      box.style.cssText = `left:${x * 100}%;top:${y * 100}%;width:${w * 100}%;height:${h * 100}%`;
    });
    const end = e => {
      if (!start) return; const p = pt(e);
      const r = [Math.min(start[0], p[0]), Math.min(start[1], p[1]), Math.abs(p[0] - start[0]), Math.abs(p[1] - start[1])].map(v => Math.round(v * 10000) / 10000);
      start = null;
      if (r[2] < 0.01 || r[3] < 0.005) { this._drawRects(); return; }
      this.rects = [r]; this._drawRects();
      if (this.opts.onCapture) this.opts.onCapture(r);
    };
    this.ov.addEventListener('pointerup', end); this.ov.addEventListener('pointercancel', () => { start = null; this._drawRects(); });
  }

/* ---------- snippet: crop the cited rectangle straight out of the page ----------
   A build step would pre-render this to WebP in a published site; here it is live. */
async function renderSnippet(canvas, assetId, pageNo, rect, cssWidth) {

}

  const topics = TAGS.filter(t => t.group === 'topic' && t.parent);
  const example = SAMPLE_MODE ? MAS.m4 : null;

    </header>
    ${empty ? `<div class="emptybox"><p><b>المكتبة فارغة.</b> ${editorOn() ? 'ابدأ بالمحرر: أضف مصدرًا ثم كتابًا وبابًا وفصلًا ثم مسائلك.' : 'لم تُضف مواد بعد.'}</p>${editorOn() ? '<a class="btn primary" href="#/edit">ابدأ الإدخال</a>' : ''}</div>` : ''}
    ${ROOTS.length ? `<section><h2 class="h-sec">الكتب</h2>
      <ul class="toc">${ROOTS.map(id => { const n = NODE[id]; return `<li><a href="#/n/${id}" class="kitab-title">${TE(n.title)}</a><span class="lead"></span><span class="n">${nMasala(n.total)}</span></li>`; }).join('')}</ul>
    </section>` : ''}
    ${example ? `<section><h2 class="h-sec">مثال على فكرة المكتبة: مسألة فيها أربعة أقوال</h2>
      <ul class="mlist">${mrow(example)}</ul></section>` : ''}
    ${MASAIL.length ? `<section><h2 class="h-sec">أو ابدأ من الوسوم</h2>
      <div class="chips">${topics.map(t => `<a class="chip" href="#/s?topic=${t.id}">${esc(t.label)}</a>`).join('')}</div>
