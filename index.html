}

function viewNode(id) {
  const n = NODE[id], kids = n.children.map(k => NODE[k]);
  const kidWord = kids.length ? (kids[0].cls === 'bab' ? agree(kids.length, 'باب واحد', 'بابان', 'أبواب', 'بابًا') : agree(kids.length, 'فصل واحد', 'فصلان', 'فصول', 'فصلًا')) : '';
  const parts = [kids.length ? kidWord : '', n.total ? nMasala(n.total) : ''].filter(Boolean).join('، ');
  const up = pathOf(id).slice(0, -1);
  return `<div class="view">
    ${crumbs(up, n.title)}
    <h1 class="h-page ${n.cls === 'kitab' ? 'kitab-title' : ''}">${TE(n.title)}</h1>
    <p class="sub">${parts || 'لا مسائل بعد'}</p>
    ${editorOn() ? `<div class="ed-inline">
      <a class="btn sm primary" href="#/edit/masala/new?node=${id}">${ICON.plus} مسألة هنا</a>
      ${n.cls === 'kitab' ? `<button class="btn sm" data-action="ed-add-node" data-kind="bab" data-parent="${id}">${ICON.plus} باب</button>` : ''}
      ${n.cls === 'bab' ? `<button class="btn sm" data-action="ed-add-node" data-kind="fasl" data-parent="${id}">${ICON.plus} فصل</button>` : ''}
      <button class="btn sm" data-action="ed-edit-node" data-id="${id}">${ICON.edit} تعديل الاسم</button></div>` : ''}
    ${kids.length ? `<h2 class="h-sec">${kids[0].cls === 'bab' ? 'الأبواب' : 'الفصول'}</h2>
      <ul class="toc">${kids.map(k => `<li><a href="#/n/${k.id}">${TE(k.title)}</a><span class="lead"></span><span class="n">${nMasala(k.total)}</span></li>`).join('')}</ul>` : ''}
    ${n.masail.length ? `<h2 class="h-sec">المسائل</h2><ul class="mlist">${n.masail.map(x => mrow(MAS[x])).join('')}</ul>` : (kids.length ? '' : '<p class="empty">لا مسائل في هذا القسم بعد.</p>')}
  </div>`;
}

const sortedQawls = m => {
  const qs = m.qawls.slice();
  const death = q => { const ys = q.cites.map(c => EDITIONS[c.ed].death).filter(v => typeof v === 'number'); return ys.length ? Math.min(...ys) : 1e9; };
  if (S.sort === 'oldest') qs.sort((a, b) => death(a) - death(b) || a.n - b.n);
  else if (S.sort === 'sources') qs.sort((a, b) => b.cites.length - a.cites.length || a.n - b.n);
  return qs;
};

function khilafBar(m) {
  const n = m.qawls.length;
  const segs = sortedQawls(m).map(q => `<button class="seg ${HK[q.hukm].cls}" data-action="jump-q" data-q="${q.id}" title="القول ${ordQawl(q.n)}: ${HK[q.hukm].label}"><span class="sn">${D(q.n)}</span>${HK[q.hukm].label}</button>`).join('');
  return `<div class="khilaf ${n > 1 ? 'multi' : 'single'}" role="group" aria-label="ملخص أقوال المسألة">
    <div class="kh-lab"><strong>${n > 1 ? 'خلاف داخل المذهب' : 'قول واحد مسجَّل'}</strong>${n > 1 ? `<span>${nQawl(n)}</span>` : ''}</div>
    <div class="kh-segs">${segs}</div>
    ${n === 1 ? '<p class="kh-note">لا يعني هذا أنه لا قول غيره، بل أنه لم يُسجَّل غيره بعد.</p>' : ''}
  </div>`;
}

function citeRow(ct) {
  const E = EDITIONS[ct.ed], t = TIER[ct.tier], active = S.panel && S.panel.cid === ct.id, heads = headsOf(ct);
  return `<li class="cite tier-${ct.tier}${active ? ' active' : ''}">
    <span class="tier ${ct.tier}" title="${esc(t.tip)}">${t.label}</span>
    <span class="ctext"><b class="src">${TE(E.title)}</b><span class="loc">${esc(fmt(locText(ct)))}</span>${heads.length ? `<span class="pth sm">${heads.map(h => `<span>${TE(h)}</span>`).join('')}</span>` : ''}${ct.stale ? '<span class="stale" title="رُسم الموضع على نسخة قديمة من الملف، فأُهمل حتى يُحدَّد من جديد">الموضع يحتاج إعادة تحديد</span>' : ''}</span>
    <span class="cact"><button class="btn sm" data-action="open-cite" data-cite="${ct.id}">${t.btn}</button>
    <button class="icon-btn sm" data-action="copy-cite" data-cite="${ct.id}" aria-label="نسخ العزو" title="نسخ العزو">${ICON.copy}</button></span></li>`;
}

function qawlHTML(m, q) {
  const H = HK[q.hukm], open = S.open.has(q.id), hit = S.f.hukm.size && S.f.hukm.has(q.hukm);
  const holders = q.holders.map(h => `<span class="who"><b>${esc(SCHOLARS[h.s].name)}</b><i>${esc(h.role)}</i></span>`).join('');
  const labels = q.labels.map(l => `<button class="tj" data-action="open-cite" data-cite="${l.cite.id}" title="عرض موضع النص على الترجيح"><b>${esc(l.t)}</b><i>عند ${esc(SCHOLARS[l.by].name)}</i></button>`).join('');
  const details = open ? `<div class="details">${q.cites.map(ct => `<figure class="qt">
      <figcaption>${TE(EDITIONS[ct.ed].title)} <span class="loc">${esc(fmt(locText(ct)))}</span></figcaption>
      ${ct.quote ? `<blockquote class="quote"><span class="qkind">نقل حرفي</span>${TE(ct.quote)}</blockquote>` : '<p class="muted">لم يُدخَل النص المنقول لهذا العزو بعد.</p>'}
      ${ct.tier === 'exact' ? `<div class="snip-slot" data-cite="${ct.id}"></div>` : ''}</figure>`).join('')}
      ${q.note ? `<p class="note"><b>ملاحظة المحرر:</b> ${TE(q.note)}</p>` : ''}</div>` : '';
  return `<article class="qawl ${H.cls}${hit ? ' matched' : ''}" id="q-${q.id}" data-q="${q.id}">
    <div class="qn">${rosette(q.n)}</div>
    <div class="qb">
      <div class="qtop"><h3 class="qh">القول ${ordQawl(q.n)}</h3>${hkChip(q.hukm)}${verBadge(q.status)}${hit ? '<span class="hitbadge">يطابق التصفية</span>' : ''}</div>
      <p class="qtext">${TE(q.text)}</p>
      ${holders ? `<div class="who-row"><span class="lbl">القائلون</span>${holders}</div>` : ''}
      ${labels ? `<div class="who-row"><span class="lbl">الترجيح المنصوص</span>${labels}</div>` : ''}
      ${q.cites.length ? `<ul class="cites" aria-label="العزو: ${nSource(q.cites.length)}">${q.cites.map(citeRow).join('')}</ul>` : `<p class="nocite">لا دليل لهذا القول بعد.</p>`}
      <button class="more" data-action="toggle-q" data-q="${q.id}" aria-expanded="${open}">${open ? 'إخفاء النص المنقول' : 'عرض النص المنقول والمقتطف'}</button>
      ${details}
      ${editorOn() ? `<div class="ed-inline sm"><a class="btn xs" href="#/edit/masala/${m.id}?focus=${q.id}">${ICON.edit} تعديل القول</a><a class="btn xs" href="#/edit/masala/${m.id}?add=cite&qid=${q.id}">${ICON.plus} دليل</a></div>` : ''}
    </div></article>`;
}

function cmpTable(m, qs) {
  return `<div class="scroll-x"><table class="cmp"><thead><tr><th scope="col">القول</th><th scope="col">نوع الحكم</th><th scope="col">نصه</th><th scope="col">القائلون</th><th scope="col">الترجيح المنصوص</th><th scope="col">العزو</th></tr></thead><tbody>
    ${qs.map(q => `<tr class="${HK[q.hukm].cls}${S.f.hukm.has(q.hukm) ? ' matched' : ''}"><th scope="row"><button class="numbtn" data-action="jump-q" data-q="${q.id}" aria-label="القول ${ordQawl(q.n)}">${rosette(q.n)}</button></th>

      <div class="mtools">${editorOn() ? `<a class="btn sm primary" href="#/edit/masala/${id}">${ICON.edit} تعديل</a>` : ''}<button class="btn sm${saved ? ' on' : ''}" data-action="save" data-id="${id}" aria-pressed="${saved}" data-fk="st-${id}">${saved ? ICON.starOn : ICON.star} ${saved ? 'محفوظة' : 'حفظ'}</button>

        <button class="sg" data-action="view" data-v="table" aria-pressed="${S.view === 'table'}">جدول مقارنة</button></div>
      <label class="sel">ترتيب الأقوال
        <select data-change="sort"><option value="editor"${S.sort === 'editor' ? ' selected' : ''}>ترتيب المحرر</option><option value="oldest"${S.sort === 'oldest' ? ' selected' : ''}>الأقدم مصدرًا</option><option value="sources"${S.sort === 'sources' ? ' selected' : ''}>الأكثر عزوًا</option></select></label>
      ${S.view === 'cards' ? '<button class="btn sm ghost" data-action="toggle-all-q" data-id="' + id + '">توسيع الكل / طيّ الكل</button>' : ''}

    ${relKeys.length ? `<section class="rel"><h2 class="h-sec">مسائل مرتبطة</h2>${relKeys.map(k => `<h3 class="rel-h">${k}</h3><ul class="rel-l">${rel[k].map(x => `<li><a href="#/m/${x}">${TE(MAS[x].title)}</a><span class="rpath">${pathHTML(MAS[x].node)}</span></li>`).join('')}</ul>`).join('')}</section>` : ''}
    ${(m.topics.length || m.hal.length || m.kw.length) ? `<section class="tagsec"><h2 class="h-sec">الوسوم</h2><div class="chips">
      ${m.topics.map(t => `<a class="chip" href="#/s?topic=${t}">${esc(TAG[t].label)}</a>`).join('')}
      ${m.hal.map(t => `<a class="chip hal" href="#/s?hal=${t}">${esc(TAG[t].label)}</a>`).join('')}

    <nav class="pn" aria-label="المسائل المجاورة في هذا القسم">
      ${prev ? `<a href="#/m/${prev}">${ICON.prev}<span>السابقة</span></a>` : '<span></span>'}
      ${next ? `<a href="#/m/${next}"><span>التالية</span>${ICON.next}</a>` : '<span></span>'}</nav>
  </div>`;
}

function activeChips() {
  const out = [];
  if (S.q.trim()) out.push(`<button class="chip on" data-action="clear-q" title="إزالة">«${esc(S.q.trim())}» ${ICON.close}</button>`);
  ['topic', 'hal'].forEach(g => S.f[g].forEach(id => out.push(`<button class="chip on" data-action="ftoggle" data-group="${g}" data-id="${id}" data-fk="ac-${id}">${esc(TAG[id].label)} ${ICON.close}</button>`)));
  S.f.hukm.forEach(id => out.push(`<button class="chip on tone ${HK[id].cls}" data-action="ftoggle" data-group="hukm" data-id="${id}" data-fk="ac-${id}">${HK[id].label} ${ICON.close}</button>`));
  return out.length ? `<div class="chips active">${out.join('')}<button class="btn sm ghost" data-action="clear-all">مسح الكل</button></div>` : '';
}
function viewSearch() {
  const toks = tokensOf(S.q), res = runSearch();
  return `<div class="view">
    <h1 class="h-page">نتائج البحث</h1>
    <p class="sub" aria-live="polite">${nResult(res.length)}</p>
    ${activeChips()}
    ${res.length ? `<ul class="mlist">${res.map(r => mrow(r.m, { toks, snip: true })).join('')}</ul>`
      : '<div class="emptybox"><p>لا توجد مسألة تطابق هذا البحث مع التصفية الحالية.</p><p class="muted">خفّف التصفية، أو جرّب كلمة أخرى؛ البحث لا يفرّق بين المشكَّل وغير المشكَّل ولا بين صور الألف والهمزة.</p><button class="btn" data-action="clear-all">مسح البحث والتصفية</button></div>'}
  </div>`;
}
function viewSaved() {
  const list = [...S.saved].map(id => MAS[id]).filter(Boolean);
  return `<div class="view"><h1 class="h-page">المحفوظات</h1>
    <p class="sub">${list.length ? nMasala(list.length) : 'لا توجد مسائل محفوظة بعد'}</p>
    ${list.length ? `<ul class="mlist">${list.map(m => mrow(m)).join('')}</ul>` : '<div class="emptybox"><p>احفظ مسألة بالنجمة لتجدها هنا. تُحفظ المحفوظات في هذا المتصفح فقط.</p></div>'}</div>`;
}

/* =====================  SIDEBAR (tree)  ===================== */
function curNodeId() {
  if (S.route.name === 'node') return S.route.id;
  if (S.route.name === 'masala') return MAS[S.route.id].node;
  return null;
}
function treeHTML() {
  const cur = curNodeId();
  const item = (id, depth) => {
    const n = NODE[id], kids = n.children, open = S.expanded.has(id), isCur = id === cur;
    return `<li class="${n.cls}">
      <div class="trow${isCur ? ' current' : ''}" style="--d:${depth}">
        ${kids.length ? `<button class="tw" data-action="toggle-node" data-id="${id}" data-fk="tw-${id}" aria-expanded="${open}" aria-label="${esc(fmt(n.title))}">${ICON.chev}</button>` : '<span class="tw sp"></span>'}
        <a class="tl" href="#/n/${id}"${isCur ? ' aria-current="page"' : ''}>${TE(n.title)}</a><span class="cnt" title="${nMasala(n.total)}">${D(n.total)}</span>
      </div>${kids.length && open ? `<ul>${kids.map(k => item(k, depth + 1)).join('')}</ul>` : ''}</li>`;
  };
  return `<div class="side-h"><h2>الفهرس</h2><div class="side-a"><button class="link" data-action="expand-all-nodes">توسيع</button><button class="link" data-action="collapse-all-nodes">طيّ</button></div></div>
    ${ROOTS.length ? `<nav aria-label="فهرس المكتبة"><ul class="tree">${ROOTS.map(id => item(id, 0)).join('')}</ul></nav>` : '<p class="side-empty">لا توجد كتب بعد.</p>'}
    ${editorOn() ? `<div class="side-ed"><button class="btn sm" data-action="ed-add-node" data-kind="kitab" data-parent="">${ICON.plus} كتاب</button><a class="btn sm ghost" href="#/edit/tree">إدارة الفهرس</a></div>` : ''}`;
}

/* =====================  FILTER TRAY  ===================== */
function trayHTML() {
  const fc = facetCounts();
  const chip = (g, id, label, cls = '') => {
    const sel = S.f[g].has(id), n = fc[g][id];
    return `<button class="chip ${cls}" data-action="ftoggle" data-group="${g}" data-id="${id}" data-fk="f-${id}" aria-pressed="${sel}"${!sel && n === 0 ? ' disabled' : ''}>${label}<span class="n">${D(n)}</span></button>`;
  };
  const parents = TAGS.filter(t => t.group === 'topic' && !t.parent);
  const topic = parents.map(p => `<div class="tp">${chip('topic', p.id, esc(p.label), 'parent')}<div class="kids">${TAGS.filter(t => t.parent === p.id).map(c => chip('topic', c.id, esc(c.label))).join('')}</div></div>`).join('');
  const hukm = HUKM.map(h => chip('hukm', h.id, h.label, 'tone ' + h.cls)).join('');
  const hal = TAGS.filter(t => t.group === 'hal').map(t => chip('hal', t.id, esc(t.label))).join('');
  const kws = [...new Set(MASAIL.flatMap(m => m.kw))].slice(0, 14);
  return `<div class="tray-grid">
    <fieldset class="fg wide"><legend>الموضوع</legend>${topic}</fieldset>
    <fieldset class="fg"><legend>نوع الحكم <small>(يطابق أي قول في المسألة)</small></legend><div class="chips">${hukm}</div></fieldset>
    <fieldset class="fg"><legend>الحال</legend><div class="chips">${hal}</div></fieldset>
    <fieldset class="fg"><legend>كلمات مفتاحية</legend><div class="chips">${kws.map(k => `<button class="chip kw" data-action="kw" data-kw="${esc(k)}">${esc(k)}</button>`).join('')}</div></fieldset>
  </div>
  <div class="tray-f"><span class="muted" aria-live="polite">${nResult(runSearch().length)}</span>
    <button class="btn sm ghost" data-action="clear-all"${searchActive() ? '' : ' disabled'}>مسح التصفية</button>
    <button class="btn sm primary" data-action="toggle-tray">تم</button></div>`;
}

/* =====================  SETTINGS POPOVER  ===================== */
function settingsHTML() {
  const seg = (label, key, opts) => `<div class="set-row"><span>${label}</span><div class="seg-group">${opts.map(([v, l]) => `<button class="sg" data-action="pref" data-key="${key}" data-v="${v}" aria-pressed="${String(PREF[key]) === String(v)}">${l}</button>`).join('')}</div></div>`;
  return seg('المظهر', 'theme', [['auto', 'تلقائي'], ['light', 'فاتح'], ['dark', 'داكن']]) +
    seg('الأرقام', 'digits', [['ar', '١٢٣'], ['en', '123']]) +
    seg('التشكيل', 'tashkeel', [[true, 'إظهار'], [false, 'إخفاء']]) +
    seg('حجم نص الأقوال', 'size', [[0.9, 'أصغر'], [1, 'عادي'], [1.15, 'أكبر']]) +
    (EDITOR ? seg('أدوات المحرر', 'editor', [[true, 'إظهار'], [false, 'إخفاء (عرض القارئ)']]) : '');
}

function locatorJSON(ct) {
  const a = ct.asset ? getAsset(ct.asset) : null;
  const o = { edition: ct.ed, volume: ct.vol, printed_page: ct.page };
  if (a && a.kind === 'file') { o.asset = a.id; o.pdf_page = ct.pdfPage; o.page_map = { offset: a.offset || 0 }; if (ct.rect) o.rects = [ct.rect]; }
  else if (a && a.kind === 'link') { o.url = a.url + '#page=' + ct.pdfPage; }
  return JSON.stringify(o, null, 1);
}

function fillEnv() {
  const el = $('#labenv'); if (!el) return;
  const ua = navigator.userAgent, m = ua.match(/(Edg|Chrome|Firefox|Version)\/[\d.]+/);
  const yn = v => (v === true ? '<span class="ok">نعم</span>' : v === false ? '<span class="no">لا</span>' : '<span class="muted">غير معروف</span>');
  let blobOk = false, lsOk = false;
  try { blobOk = !!URL.createObjectURL(new Blob(['x'])); } catch (e) { /* noop */ }
  try { localStorage.setItem('mfl:probe', '1'); localStorage.removeItem('mfl:probe'); lsOk = true; } catch (e) { /* noop */ }
  const rows = [
    ['المتصفح', `<bdi dir="ltr">${esc(m ? m[0] : ua.slice(0, 40))}</bdi>`],
    ['عارض PDF مدمج <bdi dir="ltr">navigator.pdfViewerEnabled</bdi>', yn(typeof navigator.pdfViewerEnabled === 'boolean' ? navigator.pdfViewerEnabled : undefined)],
    ['شاشة لمس', yn(window.matchMedia && window.matchMedia('(pointer: coarse)').matches)],
    ['كثافة البكسل', `<bdi dir="ltr">${window.devicePixelRatio || 1}</bdi>`],
    ['PDF.js', PDF.lib ? `<bdi dir="ltr">${esc(PDF.lib.version)}</bdi> — ${esc(PDF.mode)}` : '<span class="muted">لم يُحمَّل بعد</span> <button class="btn xs" data-action="lab-loadpdf">تحميل الآن</button>'],
    ['روابط <bdi dir="ltr">blob:</bdi>', yn(blobOk)],
    ['التخزين المحلي (للمحفوظات)', yn(lsOk)],
    ['مخالفات CSP المرصودة', `<bdi dir="ltr" id="cspcount">${CSP_COUNT}</bdi>`]
  ];
  el.innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
}

function labJSON() {
  const p = LAB.page, pr = printedOf(p);
  const o = { file: SAMPLE_FILE_ID, pdf_page: p, printed_page: pr >= 1 ? pr : null };
  if (LAB.rect) o.rects = [LAB.rect];
  const el = $('#l3json'); if (el) el.textContent = JSON.stringify(o, null, 1);
  return o;
}
function labSnip() {
  const box = $('#l3snip'); if (!box) return;
  clearTimeout(snipT);
  if (!LAB.rect) { box.innerHTML = '<span class="muted">اختر موضعًا لتظهر الصورة المقتطعة.</span>'; return; }
  box.innerHTML = '<span class="muted">جارٍ التحضير…</span>';
  snipT = setTimeout(async () => {
    try {
      const cv = document.createElement('canvas');
      const r = await renderSnippet(cv, '__sample', LAB.page, LAB.rect, 360);
      box.innerHTML = ''; cv.className = 'snip'; cv.style.width = Math.floor(r.w / r.dpr) + 'px'; cv.style.height = 'auto'; box.appendChild(cv);
      labLog('ok', `مقتطف ${r.w}×${r.h} بكسل من الصفحة ${LAB.page}`);
    } catch (e) { box.innerHTML = `<span class="no">تعذّر التحضير: ${esc(e.message)}</span>`; }
  }, 160);
}
function labShow(scroll) {
  const p = LAB.page;
  const s1 = $('#l3p'); if (s1) s1.value = p;
  const lb = $('#l3label'); if (lb) lb.textContent = pageLabel(p, SAMPLE_INFO.offset, SAMPLE_INFO.pages);
  if (labPV) labPV.show(p, LAB.rect ? [LAB.rect] : [], { scroll: !!scroll });
  labJSON(); labSnip();
}

const LABAPI = {
  step(d) { LAB.page = Math.min(SAMPLE_INFO.pages, Math.max(1, LAB.page - d)); labShow(false); },
  preset(k) { LAB.key = k; LAB.rect = k === 'none' ? null : SAMPLE_BLOCKS[k]; if (labPV) labPV.setRects(LAB.rect ? [LAB.rect] : []); labJSON(); labSnip(); },
  capture() {
    LAB.cap = !LAB.cap; if (labPV) labPV.setCapture(LAB.cap);
    const b = $('#l3cap'); if (b) { b.setAttribute('aria-pressed', LAB.cap); b.classList.toggle('on', LAB.cap); b.textContent = LAB.cap ? 'ارسم الآن… (اضغط للإيقاف)' : 'وضع الالتقاط: ارسم مستطيلًا على الصفحة'; }
  },
  async copyJSON() { const ok = await copyText(JSON.stringify(labJSON())); toast(ok ? 'تم نسخ الموضع' : 'تعذّر النسخ'); },
  embedNative() {
    const p = +($('#l1p') || {}).value || LAB.page, z = ($('#l1z') || {}).checked;
    const src = pdfBlobUrl() + nativeFragment(p, z ? SAMPLE_BLOCKS.A : null, z);
    const host = $('#l2frame'); if (!host) return;
    host.innerHTML = `<iframe class="lab-if" title="عارض المتصفح المضمَّن" src="${esc(src)}"></iframe>`;
    const f = host.firstElementChild;
    f.addEventListener('load', () => labLog('info', 'حدث load للإطار المضمَّن (لا يعني أن الصفحة المطلوبة ظهرت؛ تحقق بالعين)'));
    f.addEventListener('error', () => labLog('err', 'خطأ في الإطار المضمَّن'));
    labLog('info', 'محاولة تضمين: ' + src.replace(/^blob:[^#]*/, 'blob:…'));
  },
  removeEmbed() { const h = $('#l2frame'); if (h) h.innerHTML = ''; },
  embedExt() {
    const url = $('#l5u').value.trim(), p = +$('#l5p').value || 1, host = $('#l5frame');
    if (!/^https?:\/\//i.test(url)) { toast('أدخل رابطًا يبدأ بـ https://'); return; }
    host.innerHTML = `<iframe class="lab-if" title="ملف خارجي" src="${esc(url + '#page=' + p)}"></iframe>`;
    labLog('info', 'محاولة تضمين خارجي: ' + url + '#page=' + p);
  },
  async loadPdf() { try { await getPdf('__sample'); fillEnv(); } catch (e) { toast('تعذّر تحميل PDF.js'); fillEnv(); } }
};

function mountLab() {
  if (S.route.name !== 'lab') { if (labPV) { labPV.destroy(); labPV = null; } return; }
  fillEnv();
  const upd1 = () => {
    const p = +$('#l1p').value, z = $('#l1z').checked, frag = nativeFragment(p, z ? SAMPLE_BLOCKS.A : null, z);
    $('#l1frag').textContent = frag; $('#l1open').href = pdfBlobUrl() + frag;
  };
  $('#l1p').addEventListener('change', upd1); $('#l1z').addEventListener('change', upd1);
  $('#l1open').addEventListener('click', () => labLog('info', 'فتح تبويب جديد: ' + $('#l1frag').textContent));
  upd1();
  const upd5 = () => { LAB.extUrl = $('#l5u').value.trim(); LAB.extPage = +$('#l5p').value || 1; $('#l5open').href = LAB.extUrl + '#page=' + LAB.extPage; };
  $('#l5u').addEventListener('input', upd5); $('#l5p').addEventListener('input', upd5); upd5();
  $('#l3p').addEventListener('change', e => { LAB.page = +e.target.value; labShow(false); });
  if (labPV) labPV.destroy();
  labPV = new PageView($('#labhost'), { onCapture: r => { LAB.rect = r; LAB.key = 'custom'; labJSON(); labSnip(); } });
  labPV.setCapture(LAB.cap);
  labShow(false);
}

/* ===== editor.js ===== */
/* =====================================================================
   EDITOR (Arabic). Everything an editor needs, inside the same app:
   guide · masa'il list · tree · sources (+PDF) · vocabularies · data (backup/import) · the mas'ala composer (composer.js)
   All changes go through Lib.commit(), so they are saved, re-derived, re-rendered and undoable.
   ===================================================================== */
const ED = { m: null, mKey: '', dirty: false, errors: [], notice: '', lastCite: null, dlg: null, f: { q: '', status: '', issues: false }, pendingFocus: null, fixesSeen: false };
const EDACT = {};                                     // data-action handlers (main.js looks here first)
const EDLIVE = {};                                    // data-live handlers (field-level reactions)
const EDROOT = { m: () => ED.m, dlg: () => ED.dlg, f: () => ED.f };

ICON.undo = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.5 6.5h6a3 3 0 010 6H6M3.5 6.5L6 4M3.5 6.5L6 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- tiny helpers ---------- */
const getPath = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
function setPath(o, p, v) { const ks = p.split('.'); let a = o; for (let i = 0; i < ks.length - 1; i++) a = a[ks[i]]; a[ks[ks.length - 1]] = v; }
const opt = (v, label, cur) => `<option value="${esc(v)}"${String(v) === String(cur) ? ' selected' : ''}>${esc(label)}</option>`;
function fld(label, control, o = {}) {
  return `<label class="fld${o.wide ? ' wide' : ''}${o.cls ? ' ' + o.cls : ''}"><span class="fl">${label}${o.req ? '<b class="req" aria-hidden="true">*</b>' : ''}</span>${control}${o.hint ? `<small class="fh">${o.hint}</small>` : ''}</label>`;
}
function inp(root, path, val, o = {}) {
  return `<input class="ed-in${o.cls ? ' ' + o.cls : ''}" data-root="${root}" data-bind="${path}" value="${esc(val == null ? '' : val)}"${o.ph ? ` placeholder="${esc(o.ph)}"` : ''}${o.mode ? ` inputmode="${o.mode}"` : ''}${o.live ? ` data-live="${o.live}"` : ''}${o.attrs ? ' ' + o.attrs : ''}>`;
}
function txa(root, path, val, rows, o = {}) {
  return `<textarea class="ed-in ed-ta${o.cls ? ' ' + o.cls : ''}" data-root="${root}" data-bind="${path}" rows="${rows || 3}"${o.ph ? ` placeholder="${esc(o.ph)}"` : ''}>${esc(val == null ? '' : val)}</textarea>`;
}
function sel(root, path, val, options, o = {}) {
  return `<select class="ed-in" data-root="${root}" data-bind="${path}"${o.rerender ? ' data-rerender="1"' : ''}${o.live ? ` data-live="${o.live}"` : ''}${o.attrs ? ' ' + o.attrs : ''}>${options.map(([v, l]) => opt(v, l, val)).join('')}</select>`;
}
const nodeLabel = id => pathOf(id).map(n => n.title).join(' › ');
const byAr = (a, b) => String(a).localeCompare(String(b), 'ar');

/* ---------- field binding: text fields update the draft as you type; selects/checkboxes on change ---------- */
function edBind(e, isChange) {
  const el = e.target, ds = el.dataset; if (!ds || (!ds.bind && !ds.live)) return;
  const isText = el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && !['checkbox', 'radio'].includes(el.type));
  if (isText ? isChange : !isChange) return;
  if (ds.bind) {
    const root = EDROOT[ds.root] && EDROOT[ds.root](); if (!root) return;

/* ---------- quality checks ("lint") ---------- */
function lintLibrary() {
  const out = [];
  MASAIL.forEach(m => {
    const link = '#/edit/masala/' + m.id;
    if (!m.qawls.length) out.push({ sev: 'warn', m, text: 'مسألة بلا أقوال', link });
    if (m.status === 'published' && m.qawls.some(q => !q.cites.length)) out.push({ sev: 'err', m, text: 'منشورة وفيها قول بلا دليل', link });
    m.qawls.forEach(q => {
      const lk = link + '?focus=' + q.id, at = 'القول ' + ordQawl(q.n);
      if (!q.cites.length) out.push({ sev: 'warn', m, text: at + ': بلا دليل', link: lk });
      if (!q.text.trim()) out.push({ sev: 'err', m, text: at + ': بلا نص', link: lk });
      q.cites.forEach(c => {
        const E = EDITIONS[c.ed], a = c.asset ? getAsset(c.asset) : null;
        if (!c.page) out.push({ sev: 'err', m, text: at + ': دليل بلا رقم صفحة', link: lk });
        if (c.stale) out.push({ sev: 'warn', m, text: at + ': الموضع المحدد على ملف قديم ويحتاج إعادة تحديد', link: lk });
        if (E && E.volumes && c.vol > E.volumes) out.push({ sev: 'err', m, text: at + ': الجزء ' + c.vol + ' خارج عدد أجزاء «' + E.title + '»', link: lk });
        if (a && a.kind === 'file' && assetPages(a) && (c.pdfPage < 1 || c.pdfPage > assetPages(a))) out.push({ sev: 'err', m, text: at + ': الصفحة ' + c.page + ' خارج ملف PDF (راجع ضبط أرقام الصفحات)', link: lk });
      });
    });
  });
  Object.values(EDITIONS).forEach(E => {
    if (E.assets.some(id => ASSETS[id] && ASSETS[id].kind === 'file') && !RIGHTS_CLEARED.includes(E.rights))
      out.push({ sev: 'info', text: 'ملف PDF لمصدر «' + E.title + '» حقوقه «' + RIGHTS[E.rights] + '»: للاستعمال المحلي فقط، لا تنشره', link: '#/edit/sources' });
  });
  return out;
}

function nodeDialog({ kind, parent = '', id = null, onDone = null }) {

function sourceSave() {

  const title = (s.title || '').trim(); if (!title) { dlgError('اكتب عنوان الكتاب'); return false; }

  if (s.id) {
    const cited = allCites().filter(c => c.ed === s.id && (c.vol || 1) > vols).length;

  let newId = s.id, cb = s.onDone;
  Lib.commit(doc => {

async function attachPdf(edId, vol, file) {

  const old = assetFor(edId, vol);

    if (!(await askConfirm({ title: 'استبدال الملف', ok: 'استبدل', danger: !!stale, body: stale ? `للجزء ملف سابق، وقد حُدد عليه موضع ${D(stale)} دليلًا. تبقى الأدلة نصية وتحتاج إعادة تحديد مواضعها على الملف الجديد.` : 'سيحل الملف الجديد محل السابق.' }))) return;
  }
  dlgError(''); s.busy = { vol, msg: 'جارٍ الرفع…', pct: 0 }; dlgDraw();
  const upd = (msg, pct) => { if (ED.dlg !== s) return; s.busy = { vol, msg, pct }; const p = document.querySelector('.volrow .busy'); if (p) { p.firstChild.textContent = msg + ' '; const pr = p.querySelector('progress'); if (pr) pr.value = pct; } };
  try {

    upd('جارٍ قراءة الملف…', 1);
    let src = st.src === 'server' ? { url: st.url } : { data: new Uint8Array(await file.arrayBuffer()) };
    const info = await probePdf(src);
    const off = offsetFromLabels(info.labels);
    const rec = { id: uid('a'), ed: edId, vol, kind: 'file', src: st.src, sha: st.sha, url: st.url, name: st.name, bytes: st.bytes, pages: info.pages, offset: off == null ? 0 : off };
    if (old) releasePdf(old.id);
    Lib.commit(doc => { doc.assets = doc.assets.filter(a => !(a.ed === edId && (a.vol || 1) === vol)); doc.assets.push(rec); });
    s.busy = null;
    if (off == null) { s.step = 'cal'; s.cal = { vol, pdfPage: 1, printed: '' }; toast('لم نجد ترقيمًا داخل الملف. اضبط أرقام الصفحات'); }
    else toast('أُرفق الملف: ' + D(info.pages) + ' صفحة، والصفحة المطبوعة ١ هي صفحة الملف ' + D(1 + off));

}

function validateDraft(m) {
  const e = [];
  if (!m.node || !NODE[m.node]) e.push({ sec: 'sec-loc', text: 'اختر موضع المسألة في الفهرس (كتابًا على الأقل).' });
  if (!m.title.trim()) e.push({ sec: 'sec-masala', text: 'اكتب عنوان المسألة.' });
  const kept = m.qawls.filter(q => !isBlankQawl(q));
  if (m.status !== 'draft' && !kept.length) e.push({ sec: 'sec-qawls', text: 'لا تصلح حالة «' + STATUS_MASALA[m.status] + '» لمسألة بلا أقوال.' });
  kept.forEach(q => {
    const at = 'القول ' + ordQawl(m.qawls.indexOf(q) + 1), sec = 'edq-' + q.id, cs = q.cites.filter(c => !isBlankCite(c));
    if (!q.text.trim()) e.push({ sec, text: at + ': اكتب نص القول.' });
    if (!q.hukm || !HK[q.hukm]) e.push({ sec, text: at + ': اختر نوع الحكم.' });
    cs.forEach(c => {
      const E = EDITIONS[c.ed];
      if (!c.ed || !E) e.push({ sec, text: at + ': اختر المصدر في كل دليل.' });
      else if ((toInt(c.vol) || 1) > (E.volumes || 1)) e.push({ sec, text: at + ': الجزء خارج عدد أجزاء «' + E.title + '».' });
      if (!toInt(c.page)) e.push({ sec, text: at + ': رقم الصفحة مطلوب في كل دليل.' });
    });
    q.labels.forEach(l => { if ((l.t || '').trim() && (!l.by || !cs.some(c => c.id === l.cite))) e.push({ sec, text: at + ': الترجيح يحتاج قائلًا ودليلًا.' }); });
    if (m.status === 'published' && !cs.length) e.push({ sec, text: at + ': لا يمكن النشر وهذا القول بلا دليل.' });
  });
  return e;
}
function draftToDoc(m) {
  const rec = { id: m.id || uid('m'), node: m.node, title: m.title.trim(), situation: m.situation.trim(), status: m.status,
    topics: m.topics.filter(t => TAG[t]), hal: m.hal.filter(t => TAG[t]), kw: m.kw.slice(),
    related: m.related.filter(r => r.to && MAS[r.to]).map(r => ({ to: r.to, type: r.type })), qawls: [] };
  m.qawls.filter(q => !isBlankQawl(q)).forEach(q => {
    const cites = q.cites.filter(c => !isBlankCite(c)).map(c => {
      const r = { id: c.id, ed: c.ed, vol: toInt(c.vol) || 1, page: toInt(c.page) }, pe = toInt(c.pageEnd);
      if (pe && pe > r.page) r.pageEnd = pe;
      if ((c.bab || '').trim()) r.bab = c.bab.trim(); if ((c.fasl || '').trim()) r.fasl = c.fasl.trim(); if ((c.quote || '').trim()) r.quote = c.quote.trim();
      if (c.rect) { r.rect = c.rect; r.asset = c.asset; }
      return r;
    });
    const ids = new Set(cites.map(c => c.id));
    rec.qawls.push({ id: q.id, hukm: q.hukm, text: q.text.trim(), kind: q.kind, status: q.status, note: (q.note || '').trim(),
      holders: q.holders.filter(h => h.s).map(h => ({ s: h.s, role: (h.role || '').trim() })), cites,
      labels: q.labels.filter(l => (l.t || '').trim() && l.by && ids.has(l.cite)).map(l => ({ t: l.t.trim(), by: l.by, cite: l.cite })) });
  });
  return rec;
}
function composerSave(mode) {
  if (!ED.m) return false;
  const kw = document.querySelector('[data-kw-input]'); if (kw && kw.value.trim()) { const v = kw.value.replace(/[,،]/g, ' ').trim(); if (v && !ED.m.kw.includes(v)) ED.m.kw.push(v); }
  ED.errors = validateDraft(ED.m);
  if (ED.errors.length) { edRefresh(); const a = $('#comp-errs'); if (a) { a.scrollIntoView({ block: 'center' }); a.focus(); } return false; }
  const rec = draftToDoc(ED.m), isNew = !ED.m.id;
  try { Lib.commit(doc => { const i = doc.masail.findIndex(x => x.id === rec.id); if (i >= 0) doc.masail[i] = rec; else doc.masail.push(rec); }); }
  catch (e) { toast('تعذّر الحفظ: ' + e.message); return false; }
  const last = rec.qawls.flatMap(q => q.cites).pop(); if (last) ED.lastCite = { ed: last.ed, vol: last.vol, bab: last.bab || '', fasl: last.fasl || '' };
  ED.dirty = false; ED.errors = []; ED.notice = mode === 'add' ? 'تم الحفظ. أدخل مسألتك التالية.' : 'تم حفظ المسألة.';
  S.expanded.add(rec.node); ED.mKey = '';
  if (mode === 'add') go('#/edit/masala/new?node=' + rec.node);
  else if (isNew) go('#/edit/masala/' + rec.id);
  else { composerEnter(); render(); }
  return true;
}
EDACT['ed-save'] = () => composerSave('stay');
EDACT['ed-save-add'] = () => composerSave('add');
EDACT['ed-cancel'] = async () => {
  if (ED.dirty && !(await askConfirm({ title: 'إلغاء التعديلات', body: 'ستُهمل التعديلات غير المحفوظة.', ok: 'أهملها', danger: true }))) return;
  ED.dirty = false; ED.mKey = ''; go('#/edit/masail');
};
EDACT['ed-del-masala'] = async () => {
  const m = ED.m; if (!m || !m.id) return;
  if (!(await askConfirm({ title: 'حذف المسألة', body: `ستُحذف «${esc(m.title)}» بكل أقوالها وأدلتها. (يمكنك التراجع بعد ذلك.)`, ok: 'احذف المسألة', danger: true }))) return;
  Lib.commit(doc => { doc.masail = doc.masail.filter(x => x.id !== m.id); doc.masail.forEach(x => { x.related = x.related.filter(r => r.to !== m.id); }); });
  ED.dirty = false; ED.mKey = ''; go('#/edit/masail'); toast('حُذفت المسألة', { action: { label: 'تراجع', fn: () => Lib.undo() } });
};
function edSaveShortcut() { if (S.route.name === 'edit' && S.route.sub === 'masala' && ED.m && !$('#dlg').open) { composerSave('stay'); return true; } return false; }

/* ===== main.js ===== */
/* =====================  ROUTER  ===================== */
let memHash = '#/';
const getHash = () => { try { return location.hash || '#/'; } catch (e) { return memHash; } };
function expandTo(nodeId) {
  let p = NODE[nodeId] && NODE[nodeId].parent;
  while (p) { S.expanded.add(p); p = NODE[p].parent; }
}
function pushRecent(id) { S.recent = [id, ...S.recent.filter(x => x !== id)].slice(0, 6); store.set('recent', S.recent); }

let lastKey = '';
const routeKey = () => S.route.name + ':' + (S.route.sub || '') + ':' + (S.route.id || '');
function applyRoute() {
  const h = getHash().slice(1), qi = h.indexOf('?');
  const path = qi < 0 ? h : h.slice(0, qi), params = new URLSearchParams(qi < 0 ? '' : h.slice(qi + 1));
  const [a, b, c] = path.split('/').filter(Boolean);
  const prevKey = routeKey();
  if (a === 'm' && MAS[b]) { S.route = { name: 'masala', id: b }; expandTo(MAS[b].node); S.expanded.add(MAS[b].node); pushRecent(b); }
  else if (a === 'n' && NODE[b]) { S.route = { name: 'node', id: b }; expandTo(b); S.expanded.add(b); }
  else if (a === 's') {
    S.route = { name: 'search' };
    const q = params.get('q') || '';
    if (S.q.trim() !== q.trim()) S.q = q;                       // keep the user's own spacing while typing
    ['topic', 'hukm', 'hal'].forEach(g => { S.f[g] = new Set((params.get(g) || '').split(',').filter(x => x && (g === 'hukm' ? HK[x] : TAG[x]))); });
  }
  else if (a === 'saved') S.route = { name: 'saved' };
  else if (a === 'lab') S.route = { name: 'lab' };
  else if (a === 'edit' && EDITOR) S.route = { name: 'edit', sub: b || 'home', id: c || null, params: Object.fromEntries(params) };
  else S.route = { name: 'home' };
  S.curHash = getHash();
  if (S.route.name !== 'search') S.prevHash = '#' + h;
  if (routeKey() !== prevKey) S.panel = null;   // a source panel belongs to the page it was opened from
  S.treeOpen = false;
}
function go(h, replace) {
  memHash = h;
  try { if (replace) history.replaceState(null, '', h); else location.hash = h; } catch (e) { /* sandboxed: fall back to in-memory routing */ }
  let ok = false; try { ok = location.hash === h; } catch (e) { /* noop */ }
  if (replace || !ok) { if (typeof closeStrayDialogs === 'function') closeStrayDialogs(); applyRoute(); render(); }
}
function syncSearch() {
  if (!searchActive()) { if (S.route.name === 'search') go(S.prevHash || '#/', true); else render(); return; }
  const p = new URLSearchParams();
  if (S.q.trim()) p.set('q', S.q.trim());
  ['topic', 'hukm', 'hal'].forEach(g => { if (S.f[g].size) p.set(g, [...S.f[g]].join(',')); });
  const h = '#/s?' + p.toString();
  if (S.route.name === 'search') go(h, true); else { S.prevHash = getHash(); go(h, false); }
}

/* =====================  RENDER  ===================== */
/* Theme. The page may be embedded in a viewer that sets data-theme on <html> itself, so 'auto' must defer to
   that (or to the OS via prefers-color-scheme). Only an explicit light/dark choice in our settings overrides it. */
const ROOT = document.documentElement;
let hostTheme = ROOT.getAttribute('data-theme'), setByUs = hostTheme;
if (typeof MutationObserver !== 'undefined') {
  new MutationObserver(() => {
    const v = ROOT.getAttribute('data-theme');
    if (v === setByUs) return;                                    // our own write
    hostTheme = v; setByUs = v;                                   // the host changed it
    if (PREF.theme !== 'auto') applyPrefs();                      // an explicit choice wins
  }).observe(ROOT, { attributes: true, attributeFilter: ['data-theme'] });
}
function applyPrefs() {
  const want = PREF.theme === 'auto' ? hostTheme : PREF.theme;
  setByUs = want;
  if (want) ROOT.setAttribute('data-theme', want); else ROOT.removeAttribute('data-theme');
  ROOT.style.setProperty('--scale', PREF.size);
}
function viewHTML() {
  switch (S.route.name) {
    case 'masala': return viewMasala(S.route.id);
    case 'node': return viewNode(S.route.id);
    case 'search': return viewSearch();
    case 'saved': return viewSaved();
    case 'lab': return viewLab();
    case 'edit': return viewEdit();
    default: return viewHome();
  }
}
function docTitle() {
  const base = 'المكتبة الفقهية المالكية' + (SAMPLE_MODE ? ' (نموذج أولي)' : '');
  if (S.route.name === 'masala') return fmt(MAS[S.route.id].title) + ' — ' + base;
  if (S.route.name === 'node') return fmt(NODE[S.route.id].title) + ' — ' + base;
  if (S.route.name === 'edit') return 'المحرر — ' + base;
  return base;
}
function updateHeader() {
  const fcount = filterCount(), fb = $('#filterCount'), sb = $('#savedCount');
  fb.hidden = !fcount; fb.textContent = D(fcount);
  sb.hidden = !S.saved.size; sb.textContent = D(S.saved.size);
  $('#trayBtn').setAttribute('aria-expanded', S.trayOpen);
  const qi = $('#q'); if (qi && document.activeElement !== qi && qi.value !== S.q) qi.value = S.q;
  $('#qclear').hidden = !S.q;
  $('#side').classList.toggle('open', S.treeOpen);
  const scrimOn = S.treeOpen || (S.panel && window.matchMedia('(max-width: 960px)').matches);
  $('#scrim').hidden = !scrimOn;
  const pop = $('#settings'); pop.hidden = !S.settingsOpen; if (S.settingsOpen) pop.innerHTML = settingsHTML();
  $('#gearBtn').setAttribute('aria-expanded', S.settingsOpen);
  $('#trayBtn').classList.toggle('on', S.trayOpen);
  document.title = docTitle();
}
function renderSide() { $('#side').innerHTML = treeHTML(); }
function renderTray() { const t = $('#tray'); t.hidden = !S.trayOpen; if (S.trayOpen) t.innerHTML = trayHTML(); }

let panelPV = null, panelKey = '';
function panelShow(scroll) {
  const ct = CITES[S.panel.cid]; if (!ct) return;
  const a = getAsset(ct.asset), p = S.panel.page, lb = $('#plabel');
  if (lb && a) lb.textContent = pageLabel(p, a.offset || 0, assetPages(a));
  if (panelPV) panelPV.show(p, (ct.rect && p === ct.pdfPage) ? [ct.rect] : [], { scroll });
}
function renderPanel() {
  const panel = $('#panel'), shell = $('#shell');
  if (S.panel && !CITES[S.panel.cid]) S.panel = null;                 // the citation was deleted or changed under us
  if (!S.panel) {
    if (panelPV) { panelPV.destroy(); panelPV = null; }
    panel.hidden = true; panel.innerHTML = ''; shell.classList.remove('has-panel'); panelKey = ''; return;
  }
  const ct = CITES[S.panel.cid];
  panel.hidden = false; shell.classList.add('has-panel');
  const key = ct.id + '|' + ct.asset + '|' + ct.tier;
  if (panelKey !== key) {
    if (panelPV) { panelPV.destroy(); panelPV = null; }
    panel.innerHTML = panelHTML(ct); panelKey = key;
    if (ct.tier === 'exact' || ct.tier === 'page') { panelPV = new PageView($('#pvhost'), { asset: ct.asset }); panelShow(true); }
  }
}
async function hydrateSnippets() {
  for (const slot of $$('.snip-slot')) {
    const ct = CITES[slot.dataset.cite]; if (!ct || !ct.rect) continue;
    const put = url => { if (slot.isConnected) slot.innerHTML = `<img class="snip" alt="مقتطف مقصوص من الصفحة ${esc(fmt(String(ct.page)))}" src="${url}">`; };
    const key = `${ct.asset}|${ct.pdfPage}|${ct.rect.join(',')}`;
    if (SNIP[key]) { put(SNIP[key]); continue; }
    slot.innerHTML = '<span class="muted">جارٍ تحضير المقتطف…</span>';
    try { const cv = document.createElement('canvas'); await renderSnippet(cv, ct.asset, ct.pdfPage, ct.rect, 560); SNIP[key] = cv.toDataURL('image/png'); put(SNIP[key]); }
    catch (e) { if (slot.isConnected) slot.innerHTML = `<span class="muted no">تعذّر تحضير المقتطف: ${esc(e.message)}</span>`; }
  }
}
function render() {
  const key = routeKey(), main = $('#main');
  const keep = key === lastKey ? main.scrollTop : 0;
  const a = document.activeElement, fk = a && a.dataset ? a.dataset.fk : null;
  applyPrefs(); renderSide(); renderTray();
  main.innerHTML = viewHTML(); main.scrollTop = keep;
  renderPanel(); updateHeader(); mountLab();
  if (S.route.name === 'edit') edAfterRender();
  if (S.route.name === 'masala') hydrateSnippets();
  updateSaveState();
  lastKey = key;
  if (fk) { const el = document.querySelector(`[data-fk="${fk}"]`); if (el && el !== document.activeElement) el.focus({ preventScroll: true }); }
}

/* =====================  EVENTS  ===================== */
function parsePref(key, v) { return key === 'tashkeel' ? v === 'true' : key === 'size' ? parseFloat(v) : v; }
function flash(el) { if (!el) return; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-action]');
  if (!t) {
    if (S.settingsOpen && !e.target.closest('#settings')) { S.settingsOpen = false; updateHeader(); }
    return;
  }
  const A = t.dataset.action, d = t.dataset;
  if (typeof EDACT !== 'undefined' && EDACT[A]) { await EDACT[A](d, t, e); return; }
  switch (A) {
    case 'toggle-tree': S.treeOpen = !S.treeOpen; updateHeader(); break;
    case 'toggle-tray': S.trayOpen = !S.trayOpen; renderTray(); updateHeader(); break;
    case 'toggle-settings': S.settingsOpen = !S.settingsOpen; updateHeader(); break;
    case 'scrim': S.treeOpen = false; S.panel = null; render(); break;
    case 'toggle-node': S.expanded.has(d.id) ? S.expanded.delete(d.id) : S.expanded.add(d.id); renderSide(); { const el = document.querySelector(`[data-fk="tw-${d.id}"]`); if (el) el.focus({ preventScroll: true }); } break;
    case 'expand-all-nodes': NODES.forEach(n => { if (NODE[n.id].children.length) S.expanded.add(n.id); }); renderSide(); break;
    case 'collapse-all-nodes': S.expanded.clear(); renderSide(); break;
    case 'ftoggle': { const set = S.f[d.group]; set.has(d.id) ? set.delete(d.id) : set.add(d.id); syncSearch(); break; }
    case 'kw': S.q = d.kw; $('#q').value = d.kw; syncSearch(); break;
    case 'clear-q': S.q = ''; $('#q').value = ''; syncSearch(); $('#q').focus(); break;
    case 'clear-all': S.q = ''; $('#q').value = ''; S.f = { topic: new Set(), hukm: new Set(), hal: new Set() }; syncSearch(); break;
    case 'save': S.saved.has(d.id) ? S.saved.delete(d.id) : S.saved.add(d.id); store.set('saved', [...S.saved]); render(); toast(S.saved.has(d.id) ? 'حُفظت المسألة' : 'أُزيلت من المحفوظات'); break;
    case 'copy-link': { let base = ''; try { base = location.href.split('#')[0]; } catch (err) { /* noop */ } toast(await copyText(base + '#/m/' + d.id) ? 'تم نسخ الرابط' : 'تعذّر النسخ'); break; }
    case 'open-cite': { const ct = CITES[d.cite]; S.panel = { cid: ct.id, page: ct.pdfPage || null }; render(); break; }
    case 'close-panel': S.panel = null; render(); break;
    case 'pg': { const ct = CITES[S.panel.cid], a = getAsset(ct.asset); S.panel.page = Math.min(assetPages(a) || 99999, Math.max(1, S.panel.page - (+d.d))); panelShow(false); break; }
    case 'copy-cite': toast(await copyText(citeText(CITES[d.cite])) ? 'تم نسخ العزو' : 'تعذّر النسخ'); break;
    case 'open-native': {
      const ct = CITES[d.cite];
      try {
        const url = (await assetNativeUrl(getAsset(ct.asset))) + nativeFragment(ct.pdfPage, null, false);
        labLog('info', 'فتح عارض المتصفح: ' + url.replace(/^blob:[^#]*/, 'blob:…'));
        const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
      } catch (err) { toast(err.message || 'تعذّر فتح الملف'); }
      break;
    }
    case 'toggle-q': S.open.has(d.q) ? S.open.delete(d.q) : S.open.add(d.q); render(); break;
    case 'toggle-all-q': { const m = MAS[d.id], all = m.qawls.every(q => S.open.has(q.id)); m.qawls.forEach(q => all ? S.open.delete(q.id) : S.open.add(q.id)); render(); break; }
    case 'jump-q': { if (S.view === 'table') { S.view = 'cards'; render(); } const el = document.getElementById('q-' + d.q); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); flash(el); } break; }
    case 'view': S.view = d.v; render(); break;
    case 'pref': PREF[d.key] = parsePref(d.key, d.v); store.set(d.key, PREF[d.key]); render(); break;
    case 'lab-pg': LABAPI.step(+d.d); break;
    case 'lab-rect': LABAPI.preset(d.k); break;
    case 'lab-capture': LABAPI.capture(); break;
    case 'lab-copyjson': LABAPI.copyJSON(); break;
    case 'lab-embed-native': LABAPI.embedNative(); break;
    case 'lab-embed-remove': LABAPI.removeEmbed(); break;
    case 'lab-embed-ext': LABAPI.embedExt(); break;
    case 'lab-loadpdf': LABAPI.loadPdf(); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target.closest('[data-change]'); if (!t) return;
  if (t.dataset.change === 'sort') { S.sort = t.value; render(); }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S') && typeof edSaveShortcut === 'function' && edSaveShortcut()) { e.preventDefault(); return; }
  if (e.key === 'Escape') {
    if (S.settingsOpen) { S.settingsOpen = false; updateHeader(); }
    else if (S.panel) { S.panel = null; render(); }
    else if (S.trayOpen) { S.trayOpen = false; renderTray(); updateHeader(); }
    else if (S.treeOpen) { S.treeOpen = false; updateHeader(); }
  } else if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '')) { e.preventDefault(); $('#q').focus(); }
});
document.addEventListener('securitypolicyviolation', e => { CSP_COUNT++; labLog('err', `CSP حجبت: ${e.violatedDirective} ← ${e.blockedURI || 'inline'}`); const c = document.getElementById('cspcount'); if (c) c.textContent = CSP_COUNT; });
window.addEventListener('hashchange', () => { if (typeof edAllowLeave === 'function' && !edAllowLeave(getHash())) return; if (typeof closeStrayDialogs === 'function') closeStrayDialogs(); applyRoute(); render(); });
window.addEventListener('beforeunload', e => { if ((typeof ED !== 'undefined' && ED.dirty) || (Lib.status === 'saving' || Lib.status === 'error' || Lib.status === 'conflict')) { e.preventDefault(); e.returnValue = ''; } });

/* =====================  BOOT  ===================== */
$('#q').addEventListener('input', e => { S.q = e.target.value; syncSearch(); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Escape' && S.q) { S.q = ''; e.target.value = ''; syncSearch(); } });
(async function boot() {
  try { await Lib.init(); }
  catch (e) {
    $('#main').innerHTML = `<div class="view"><div class="emptybox"><p><b>تعذّر تحميل المكتبة.</b></p><p class="muted">${esc(e.message || String(e))}</p></div></div>`;
    return;
  }
  if (!S.expanded.size && ROOTS.length) S.expanded.add(ROOTS[0]);
  applyRoute(); render();
  document.body.dataset.ready = '1';
})();
window.__mfl = { S, MAS, NODE, CITES, EDITIONS, ASSETS, HUKM, go, render, runSearch, normalize, highlight, PDF, Lib, getDoc: () => DOC, getED: () => (typeof ED !== 'undefined' ? ED : null) };

})();
</script>
